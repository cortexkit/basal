[package]
name = "basal-worker"
version = "0.1.0"
description = "ck-basal-worker: the confined QuickJS engine that runs basal flows."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# The worker links the protocol and the engine only. It must never depend on
# a store, on subc, or on basal-core: a compromised worker then has no code
# path to the journal or to hosts. tests/dependency_fence.rs enforces this.
[dependencies]
basal-proto.workspace = true
libc.workspace = true
rquickjs.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"
seccompiler = "=0.5.0"

# The worker's own startup checks on Windows: its tokens, mitigation
# policies, handle table and thread CPU time. Every function used here is
# exported by kernel32, advapi32 or ntdll, so the image imports no DLL that
# would pull User32, GDI or COM into the confined process.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
    "Win32_System_Pipes",
] }

[features]
default = []
# Test-only: lets the worker act on `--confinement-deviation=<name>`, which
# basal-launch passes for the three startup checks the parent cannot break
# from outside (a thread token left in place, a failed or skipped integrity
# lowering). A worker built without this feature refuses that argument as
# unknown, so a production worker has no way to skip a check.
deviations = []

[dev-dependencies]
serde_json.workspace = true

# basal-testkit does not build on Windows yet. The test files that use it are
# compiled only on other systems until it does.
[target.'cfg(not(windows))'.dev-dependencies]
basal-testkit.workspace = true

# On Windows every test spawn of the worker goes through the launcher, under
# the real confinement. Its test variants break one confinement property at a
# time, for the worker's refusal tests.
[target.'cfg(windows)'.dev-dependencies]
basal-launch = { workspace = true, features = ["deviations"] }

[[bin]]
name = "ck-basal-worker"
path = "src/main.rs"

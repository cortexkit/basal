[package]
name = "basal-testkit"
version = "0.1.0"
description = "Test parents, deterministic mock hosts, crash harnesses and mutation controls for basal."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
basal-core.workspace = true
basal-host.workspace = true
basal-proto.workspace = true
blake3.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
libc.workspace = true
# The local HTTPS server the net.fetch tests talk to.
rcgen.workspace = true
rustls.workspace = true

[target.'cfg(windows)'.dependencies]
basal-launch.workspace = true
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
basal-host = { workspace = true, features = ["rig-kill-hook"] }
jiff.workspace = true
subc-protocol.workspace = true

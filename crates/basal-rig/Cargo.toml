[package]
name = "basal-rig"
version = "0.1.0"
description = "Test support for basal's isolated ckdev-flows rig only: consent and run-scope probes, and the live contract suite against real prefrontal-core. Never deployed."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Placed on the rig as `ckdev-callosum` by script/flows-rig.sh and configured
# only in the rig's daemon config, never in a production one.
[[bin]]
name = "ck-callosum-stub"
path = "src/bin/ck-callosum-stub.rs"
test = true

# Only script/flows-rig.sh builds and places this probe in its isolated daemon
# config. Production stage.sh never builds or places basal-rig binaries.
[[bin]]
name = "ckdev-runscope-probe"
path = "src/bin/ckdev-runscope-probe.rs"
test = true

# Run by `script/flows-rig.sh test` against a started rig. `cargo test` builds
# it but never runs it.
[[bin]]
name = "basal-rig-contract"
path = "src/bin/basal-rig-contract.rs"
test = true

[dependencies]
async-trait.workspace = true
blake3.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
subc-client-rs.workspace = true
subc-protocol.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[target.'cfg(windows)'.dependencies]
basal-launch.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
basal-host.workspace = true
basal-proto.workspace = true

[package]
name = "basal-module"
version = "0.1.0"
description = "The supervised ck-basal module: subc manifest and serve, the worker pool, the loops, the flow ops and the dry run."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "ck-basal"
path = "src/main.rs"

# The same module against the mock hosts, driven over its stdin and stdout
# instead of subc. It exists for tests that need a real process to kill; the
# deploy script never places it.
[[bin]]
name = "ck-basal-harness"
path = "src/bin/ck-basal-harness.rs"
test = false

[features]
# Compiles the one-shot kill switch (`src/rig_kill.rs`) into ck-basal. Only
# script/flows-rig.sh turns it on, for the ckdev-flows rig's own binary; a
# production build never does.
rig-kill-hook = ["basal-host/rig-kill-hook"]

[dependencies]
basal-core.workspace = true
basal-host.workspace = true
basal-proto.workspace = true
async-trait.workspace = true
cortexkit-log.workspace = true
cortexkit-store-types.workspace = true
jiff.workspace = true
libc.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
subc-client-rs.workspace = true
subc-protocol.workspace = true
tokio.workspace = true
tracing.workspace = true

# Only the macOS worker launch uses it: the module re-executes itself so
# the worker is its own "responsible process" and holds none of the
# module's macOS privacy grants (see src/process.rs).
[target.'cfg(target_os = "macos")'.dependencies]
subc-os.workspace = true

# Windows workers are started and owned by the launcher.
[target.'cfg(windows)'.dependencies]
basal-launch.workspace = true
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
basal-testkit.workspace = true
sha2.workspace = true
subc-transport.workspace = true

# tests/store_dacl.rs reads the store directory's and database's security
# descriptors back to check they are owner-only.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

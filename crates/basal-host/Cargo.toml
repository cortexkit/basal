[package]
name = "basal-host"
version = "0.1.0"
description = "The Host trait basal dispatches flow host calls through, and a deterministic mock."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Test-only switches, never enabled in a production build. The rig is basal's
# isolated test deployment (script/flows-rig.sh): a private subc daemon with
# its own modules, whose ck-basal is built with this feature through
# basal-module's feature of the same name. In this crate the feature adds:
# - the unscoped-send seam: a way to send a model call to Broca without the
#   flow's scope, so the rig can prove Broca refuses such a send;
# - network exemptions: `net.fetch` may reach hosts a test names that resolve
#   to private addresses (a local HTTPS test server), which production always
#   refuses.
# script/stage.sh checks every production ck-basal it stages for the rig's
# kill-switch variable name, which only a build with this feature contains,
# so a staged binary carries none of these switches.
rig-kill-hook = []

[dependencies]
basal-proto.workspace = true
cortexkit-resource-busy.workspace = true
httparse.workspace = true
libc.workspace = true
rustls.workspace = true
serde_json.workspace = true
serde.workspace = true
subc-client-rs.workspace = true
subc-protocol.workspace = true
tokio.workspace = true
tracing.workspace = true
webpki-roots.workspace = true

[target.'cfg(windows)'.dependencies]
# The git runner takes basal-launch's process-wide spawn lock while its
# child's handles are inheritable.
basal-launch.workspace = true
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
subc-transport.workspace = true

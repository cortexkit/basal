[package]
name = "basal-core"
version = "0.1.0"
description = "basal's runtime state: store, runs, the journal and mailbox, and the activation driver."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
test-support = ["basal-host/test-support"]

# basal-core owns every durable thing and talks to hosts only through the Host
# trait. It never depends on basal-worker: workers are separate processes
# reached through the WorkerChannel trait.
[dependencies]
basal-host.workspace = true
basal-proto.workspace = true
blake3.workspace = true
cortexkit-role-tool-provider.workspace = true
cortexkit-llm-tools.workspace = true
cortexkit-store.workspace = true
cortexkit-store-types.workspace = true
croner.workspace = true
jiff.workspace = true
jsonschema.workspace = true
rusqlite.workspace = true
serde.workspace = true
sha2.workspace = true
# Canonical JSON hashes the double a JSON number denotes, so a number must
# parse to exactly the nearest double: without `float_roundtrip`, serde_json
# may land one unit away, and a catalog digest would differ from the one
# another canonical JSON implementation computes for the same text.
serde_json = { workspace = true, features = ["float_roundtrip"] }
subc-protocol.workspace = true
tracing.workspace = true

[dev-dependencies]
# Give this dependency a different name so --features basal-core/test-support
# still selects basal-core's own feature rather than this development dependency.
basal-core-test-support = { package = "basal-core", path = ".", features = ["test-support"] }
# Consume the immutable held-reply fixtures shipped by the wire-contract crate.
cortexkit-role-tool-provider = { workspace = true, features = ["test-vectors"] }
cortexkit-llm-tools = { workspace = true, features = ["test-vectors"] }

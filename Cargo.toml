[workspace]
resolver = "3"
members = [
    "crates/basal-proto",
    "crates/basal-worker",
    "crates/basal-host",
    "crates/basal-core",
    "crates/basal-testkit",
    "crates/basal-module",
    "crates/basal-launch",
    "crates/basal-rig",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.89"

[workspace.dependencies]
# Dependencies do not require sibling checkouts.
basal-core = { path = "crates/basal-core" }
basal-host = { path = "crates/basal-host" }
basal-launch = { path = "crates/basal-launch" }
basal-proto = { path = "crates/basal-proto" }
basal-testkit = { path = "crates/basal-testkit" }
blake3 = "1.8"
getrandom = "0.3"
# Cron patterns for schedules. Used only to parse a pattern and to find the
# wall-clock times that match it; basal applies its own time-zone rules on
# top (see basal-core's schedule module), so croner's own DST behaviour is
# never relied on. The jiff backend lets both sides share one time type.
croner = { version = "4.0", default-features = false, features = ["jiff"] }
# Time zones for schedules. Only the bundled IANA database is used, never
# the host's zoneinfo or its local zone, so due times are the same on every
# machine and in every test.
jiff = { version = "0.2.37", default-features = false, features = ["std", "tzdb-bundle-always"] }
# Shared test-binary staging keeps test executables off removable build volumes.
cortexkit-test-support = "=0.1.10"
# The fleet's storage mechanics: open with the single-writer lease, WAL and a
# busy timeout, and versioned migrations. Pinned exactly, as astrocyte does.
cortexkit-store = { version = "=0.2.5", features = ["sqlite"] }
cortexkit-store-types = "0.2.2"
cortexkit-role-tool-provider = "=0.10.4"
cortexkit-role-tool-provider-conformance = "=0.10.1"
# The provider-owned resource-busy refusal is shared across the fleet.
cortexkit-resource-busy = { git = "https://github.com/cortexkit/commons", rev = "c46f324133c5df6411703714e4c147f7cc8554a0" }
# The driver cortexkit-store is built on. basal-core writes its own queries
# against the connection the store hands out, so it names the same major.
rusqlite = "0.32"
libc = "0.2.180"
# The engine. Only the default `std` feature: no module loader, no futures
# adapter, no dynamic loading.
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Compiles and checks codemode tool input schemas (draft 2020-12). Default
# features are off so the crate cannot fetch a schema over HTTP or read one
# from a file: a tool schema may only refer to its own document.
jsonschema = { version = "0.47", default-features = false }
# Checks SHA-256 of contract evidence and test vectors against the digests
# published by their owners.
sha2 = "0.10"
# The module shell. subc-client-rs owns HELLO, route binding, health and the
# frame lifecycle; subc-protocol is the manifest and route vocabulary it
# speaks. Keep the scope-stamp reader current with the protocol.
subc-client-rs = "0.29.3"
subc-os = "0.1.17"
subc-protocol = "0.32.4"
subc-transport = "0.13.0"
async-trait = "0.1"
async-nats = { version = "0.50", default-features = false, features = ["jetstream", "kv", "nkeys", "nuid", "ring", "server_2_10"] }
cortexkit-bus-naming = "=0.2.0"
cortexkit-bus-trait = "=0.3.0"
cortexkit-bus-nats = "=0.3.0"
base64 = "0.22"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# The fleet's log format and retention; the module logs through it as
# entorhinal does.
cortexkit-log = "0.3.5"
tracing = "0.1"
# net.fetch, the network built-in. basal writes its own small HTTP/1.1
# client over rustls so it controls every step the safety rules name:
# the connection goes to the one address it checked, redirects are
# followed by hand, and nothing reads cookies, proxies or credentials from
# the environment. ring is the only crypto provider, so the build needs no
# cmake. Server certificates are checked against the bundled Mozilla
# roots, the same on every machine.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
httparse = "1.10"
# Tests only: certificates for the local HTTPS server the net.fetch tests
# talk to.
rcgen = "0.13"

[profile.release]
opt-level = 3

# Build basal's own code and its Rust dependencies at opt-level 1 in dev and
# test builds (the test profile inherits dev). The suite is dominated by
# running tests, not compiling them: on a 4-vCPU Linux host, a warm rebuild
# and test of basal-module, or of basal-core and basal-module together, took
# 24-35% less time, and the whole workspace's tests ran in about 180 s
# instead of 290-550 s. The cost is compile time: a cold build takes roughly
# 1.5-2 times as long, and a push touching only basal-core, whose tests are
# quick, is a few seconds slower. Debug assertions and overflow checks do
# not depend on opt-level; they are stated here so they stay on.
[profile.dev]
opt-level = 1
debug-assertions = true
overflow-checks = true

# Optimise the bundled C engines in dev and test builds too. Every test store
# open runs basal's whole SQLite migration chain, and every flow run executes
# its script in QuickJS; unoptimised, those two dominated the serial test
# suite. Measured on a 4-vCPU Linux host, opt-level 3 made a fresh store open
# 85 ms -> 35 ms. Release builds already use opt-level 3, so this changes
# only speed, and tests now run the same optimised C that ships.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.rquickjs-sys]
opt-level = 3

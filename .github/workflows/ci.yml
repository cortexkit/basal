name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The nightly breadth audit: the full catalogue with `--broad`, which runs
  # each mutant against every test target in its package. That reveals a
  # control whose mutant breaks unrelated tests (CAUGHT_BROADLY), which a
  # normal replay of the row's own target cannot see.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the older run. On main every
# commit gets its full catalogue replay, and the nightly audit always
# finishes, so a later run never cancels either.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: 1
  CK_MUTATE_REV: 0c99c7e16d8ae22b6e114136b6b7b68be6f1394e

jobs:
  checks:
    if: github.event_name != 'schedule'
    # The worker confines itself on macOS (Seatbelt) and on Linux (seccomp and
    # Landlock), so every leg runs the worker packages. Their macOS-only probes
    # (codesign, privacy disclaim) are compiled only on macOS. The Linux
    # seccomp filter has a separate syscall table per architecture, so Linux
    # runs natively on both x86_64 and aarch64. Analysis, script checks and
    # catalogue validation run once, on the x86_64 Linux leg; the aarch64 leg
    # replays no mutation rows, so it installs no mutation runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install stable Rust and analysis components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Record installed Rust version
        id: rust
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-checks-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-checks-
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: matrix.platform != 'linux-arm64'
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ckdev-mutate
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-${{ env.CK_MUTATE_REV }}
      - name: Install pinned mutation runner
        if: matrix.platform != 'linux-arm64' && steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CK_MUTATE_REV" cortexkit-mutate
      - run: cargo fmt --all --check
        if: matrix.platform == 'linux'
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: matrix.platform == 'linux'
      - run: cargo clippy --workspace --all-targets --features basal-module/rig-kill-hook -- -D warnings
        if: matrix.platform == 'linux'
      - name: Test portable crates
        if: runner.os == 'Linux'
        run: cargo test --locked -p basal-proto -p basal-core -p basal-host
      # The module feature propagates to basal-host, so portable tests need both
      # modes as well. Enable it on the selected host crate without selecting the
      # worker-using module. Worker packages run both modes on every leg.
      - name: Test portable crates with the rig kill hook
        if: runner.os == 'Linux'
        run: cargo test --locked -p basal-proto -p basal-core -p basal-host --features basal-host/rig-kill-hook
      # A procfs mounted with hidepid hides the confined worker from its parent,
      # and the Linux startup tests then accept a weaker self-reported status.
      # GitHub's runners show every process, so require the exact parent-side
      # /proc/<pid>/status readback here; the variable has no effect on macOS.
      - name: Test confined worker packages
        env:
          BASAL_REQUIRE_VISIBLE_PROC: ${{ runner.os == 'Linux' && '1' || '' }}
        run: cargo test --locked -p basal-worker -p basal-module -p basal-testkit -p basal-rig
      - name: Test confined worker packages with the rig kill hook
        env:
          BASAL_REQUIRE_VISIBLE_PROC: ${{ runner.os == 'Linux' && '1' || '' }}
        run: cargo test --locked -p basal-worker -p basal-module -p basal-testkit -p basal-rig --features basal-module/rig-kill-hook
      - name: Check shell scripts
        if: matrix.platform == 'linux'
        run: |
          curl --fail --location --retry 3 https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/shellcheck.tar.xz"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" --version
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" -x script/*.sh
      # These Python suites invoke POSIX /bin/sh with fixture signing and
      # debugger functions; none invokes the real codesign, lldb or worker.
      - name: Check offline flow rig contracts
        if: matrix.platform == 'linux'
        run: python3 -m unittest script.tests.flows_rig -v
      - name: Check Cargo path dependency boundary
        if: matrix.platform == 'linux'
        run: |
          python3 script/check-path-deps.py
          python3 -m unittest script.tests.check_path_deps -v
      - name: Check development executable names
        if: matrix.platform == 'linux'
        run: |
          python3 script/check-ckdev-names.py
          python3 -m unittest script.tests.check_ckdev_names -v
      - name: Check offline placement cards
        if: matrix.platform == 'linux'
        run: |
          /bin/sh -n script/stage.sh
          python3 -m unittest script.tests.stage_card -v
      - name: Check catalogue platform coverage
        if: matrix.platform == 'linux'
        run: |
          python3 --version
          python3 .github/workflows/check_mutation_coverage.py
          python3 -m unittest discover -s .github/workflows -p 'test_*.py' -v
      # `ckdev-mutate check` validates every catalogue row's anchors and test
      # names. Listing test names compiles the test binaries but runs no test,
      # so no worker starts. Rows marked for the other OS are skipped, so each
      # host validates the rows it will replay.
      - run: ckdev-mutate check
        if: matrix.platform != 'linux-arm64'

  # Native aarch64 evidence for the Linux seccomp allowlist. The filter has a
  # separate aarch64 syscall table, and only a native trace shows which calls
  # glibc and the release worker actually make there. The script fails when no
  # confined worker was traced or a panic/abort probe misbehaves; its reduced
  # traces are uploaded for review against
  # crates/basal-worker/sandbox/linux/syscall-admission.md.
  aarch64-syscall-trace:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust and strace
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends strace
      - name: Trace the native release worker
        run: |
          rm -rf crates/basal-worker/sandbox/linux/traces/aarch64
          env -u BASAL_WORKER_BIN bash crates/basal-worker/sandbox/linux/trace-native.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: syscall-trace-aarch64
          path: crates/basal-worker/sandbox/linux/traces/aarch64
          if-no-files-found: error

  mutations-pr:
    if: github.event_name == 'pull_request'
    needs: checks
    # Replays the mutation controls whose files this pull request changes.
    # Every catalogue row is marked for exactly one OS, so running the replay
    # on both hosts covers every changed control without running any twice.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Record installed Rust version
        id: rust
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      # Restore the build the checks job saved for this commit and never save
      # a second copy: the repository's cache quota holds only a few target
      # directories.
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-checks-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-checks-
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ckdev-mutate
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-${{ env.CK_MUTATE_REV }}
      - name: Install pinned mutation runner
        if: steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CK_MUTATE_REV" cortexkit-mutate
      - name: Replay proofs selected by the PR diff
        run: |
          mkdir -p target/mutations
          rm -f target/mutations/diff.json
          env -u BASAL_WORKER_BIN -u BASAL_CUT_EXHAUSTIVE ckdev-mutate run --diff origin/main --report target/mutations/diff.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutations-pr-${{ matrix.platform }}
          path: target/mutations/diff.json

  # On a push to main: the full catalogue, each row against its own target.
  # Nightly or on demand: the same catalogue with `--broad`.
  mutations-main:
    if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.checks.result == 'success') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && needs.checks.result == 'success'))
    needs: checks
    # Scheduled breadth runs deliberately skip the redundant checks job.
    # A push still requires checks to succeed before replaying mutations.
    # always() lets the scheduled run proceed past that skipped dependency.
    # The event filter above remains the boundary for unrelated events.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each catalogue row is one mutation control. The 125 rows marked for
        # Linux use two shards, about 63 each. The 431 marked for macOS use five,
        # about 86 each: five is the most macOS jobs this GitHub account runs at
        # once. Each host shards the sorted catalogue on its own, and rows marked
        # for the other OS are reported SKIPPED_PLATFORM without being built.
        include:
          - { platform: linux, os: ubuntu-latest, shard: 1, shards: 2 }
          - { platform: linux, os: ubuntu-latest, shard: 2, shards: 2 }
          - { platform: macos, os: macos-latest, shard: 1, shards: 5 }
          - { platform: macos, os: macos-latest, shard: 2, shards: 5 }
          - { platform: macos, os: macos-latest, shard: 3, shards: 5 }
          - { platform: macos, os: macos-latest, shard: 4, shards: 5 }
          - { platform: macos, os: macos-latest, shard: 5, shards: 5 }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Record installed Rust version
        id: rust
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-checks-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-checks-
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ckdev-mutate
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-${{ env.CK_MUTATE_REV }}
      - name: Install pinned mutation runner
        if: steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CK_MUTATE_REV" cortexkit-mutate
      - name: Replay the full catalogue in an isolated shard
        run: |
          mkdir -p target/mutations
          rm -f target/mutations/all.json
          env -u BASAL_WORKER_BIN -u BASAL_CUT_EXHAUSTIVE ckdev-mutate run --all --shard ${{ matrix.shard }}/${{ matrix.shards }} ${BROAD:+--broad} --report target/mutations/all.json
        env:
          BROAD: ${{ github.event_name != 'push' && 'true' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutations-${{ matrix.platform }}-${{ matrix.shard }}
          path: target/mutations/all.json

  # Reads every shard's replay report (target/mutations/all.json) after both
  # hosts finish, and requires exactly one successful replay of each
  # catalogue row across all of them. A row skipped everywhere, missing from
  # every report or replayed twice fails here, even if each shard passed.
  mutation-coverage:
    if: always() && needs.mutations-main.result != 'skipped'
    needs: mutations-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutations-*
          path: target/mutation-reports
      - name: Require one successful replay for every catalogue row
        run: |
          python3 --version
          python3 .github/workflows/check_mutation_coverage.py --reports target/mutation-reports

  minimum-rust:
    if: github.event_name != 'schedule'
    # Builds every workspace target at the declared minimum Rust version. It
    # only compiles, so it needs no macOS: nothing here starts the flow
    # worker, whose sandbox exists on macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the declared minimum Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Record installed Rust version
        id: rust
        run: echo "version=$(rustc +1.88.0 --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-minimum-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-minimum-
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-
      - name: Build every target with the declared minimum Rust
        run: |
          cargo +1.88.0 check --workspace --all-targets --locked
          cargo +1.88.0 check --workspace --all-targets --locked --features basal-module/rig-kill-hook

  # Windows build baseline. basal does not build on Windows yet, and the causes
  # are measured here rather than guessed. The job runs the workspace check and
  # tests on windows-latest and records what fails without failing the
  # workflow: every build and test step continues on error, the job itself
  # continues on error, and no other job depends on it. When a step fails, a
  # second run collects the complete list (`--keep-going` for the check,
  # `--no-fail-fast` for the tests), since the plain commands stop at the
  # first failure. Every log is uploaded as the windows-baseline-logs artifact.
  windows-baseline:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Record installed Rust version
        id: rust
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-windows-baseline-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-windows-baseline-
      - name: Prepare the log directory
        run: mkdir -p "$RUNNER_TEMP/windows-baseline"
      # The Windows launcher's own tests start real confined children, so
      # they can only run here. The deviations feature adds the test-only
      # launch variants, one per confinement check. They run first and print
      # what the parent read back, so the log shows it even when the
      # workspace steps below fail.
      - name: Test the Windows launcher with its test variants
        id: test-launch
        continue-on-error: true
        timeout-minutes: 20
        run: cargo test -p basal-launch --features deviations --locked -- --show-output 2>&1 | tee "$RUNNER_TEMP/windows-baseline/test-basal-launch.log"
      - name: Check every workspace target
        id: check
        continue-on-error: true
        timeout-minutes: 40
        run: cargo check --workspace --all-targets --locked 2>&1 | tee "$RUNNER_TEMP/windows-baseline/check.log"
      - name: Check every workspace target, continuing past failed crates
        if: steps.check.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 40
        run: cargo check --workspace --all-targets --locked --keep-going 2>&1 | tee "$RUNNER_TEMP/windows-baseline/check-keep-going.log"
      - name: Test the workspace
        id: test
        continue-on-error: true
        timeout-minutes: 40
        run: cargo test --workspace --locked 2>&1 | tee "$RUNNER_TEMP/windows-baseline/test.log"
      - name: Test the workspace, continuing past failed tests
        if: steps.test.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 40
        run: cargo test --workspace --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/windows-baseline/test-no-fail-fast.log"
      # The workspace test can't build until every crate compiles on Windows,
      # so basal-host's own tests run separately to report its built-ins now.
      - name: Test basal-host on its own
        id: test-host
        continue-on-error: true
        timeout-minutes: 30
        run: cargo test -p basal-host --lib --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/windows-baseline/test-basal-host.log"
      - name: Summarize the baseline
        if: always()
        run: |
          {
            echo "## Windows baseline ($(rustc --version))"
            echo
            echo "- cargo check --workspace --all-targets --locked: ${{ steps.check.outcome }}"
            echo "- cargo test --workspace --locked: ${{ steps.test.outcome }}"
            echo "- cargo test -p basal-launch --features deviations --locked: ${{ steps.test-launch.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-baseline-logs
          path: ${{ runner.temp }}/windows-baseline
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The nightly breadth audit: the full catalogue with `--broad`, which runs
  # each mutant against every test target in its package. That reveals a
  # control whose mutant breaks unrelated tests (CAUGHT_BROADLY), which a
  # normal replay of the row's own target cannot see.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the older run. On main every
# commit gets its full catalogue replay, and the nightly audit always
# finishes, so a later run never cancels either.
# Every push to main gets its own group, so a later push never cancels the
# pending run of an earlier one: each pushed commit can be a deploy candidate
# and needs its own full result. A pull request's newer commits do cancel its
# older runs.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: 1
  # ckdev-mutate 0.12.0. It reads the catalogue from mutations.d/, one file per
  # crate or area, and every replay, shard and report covers all of its files.
  CK_MUTATE_REV: be120e9254c4972191b39b2e6814987918206afc

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install stable Rust and rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - run: cargo fmt --all --check
      - name: Check shell scripts
        run: |
          curl --fail --location --retry 3 https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/shellcheck.tar.xz"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" --version
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" -x script/*.sh
      # These suites use fixture signing and debugger functions, not the real
      # codesign, lldb or worker, so they need no Rust build or macOS runner.
      - name: Check offline flow rig contracts
        run: python3 -m unittest script.tests.flows_rig -v
      - name: Check Cargo path dependency boundary
        run: |
          python3 script/check-path-deps.py
          python3 -m unittest script.tests.check_path_deps -v
      - name: Check development executable names
        run: |
          python3 script/check-ckdev-names.py
          python3 -m unittest script.tests.check_ckdev_names -v
      - name: Check tracked local paths
        run: |
          python3 script/check-local-paths.py
          python3 -m unittest script.tests.check_local_paths -v
      - name: Check offline placement cards
        run: |
          /bin/sh -n script/stage.sh
          python3 -m unittest script.tests.stage_card -v
      - name: Check catalogue platform coverage schema
        run: |
          python3 --version
          python3 .github/workflows/check_mutation_coverage.py
          python3 -m unittest discover -s .github/workflows -p 'test_*.py' -v
          python3 -m unittest script.tests.mutation_catalogue script.tests.witness_mutations -v

  checks:
    if: github.event_name != 'schedule'
    # The worker confines itself on macOS (Seatbelt) and on Linux (seccomp and
    # Landlock), so every leg runs the worker packages. Their macOS-only probes
    # (codesign, privacy disclaim) are compiled only on macOS. The Linux
    # seccomp filter has a separate syscall table per architecture, so Linux
    # runs natively on both x86_64 and aarch64. The lint job handles build-free
    # checks; the aarch64 leg replays no mutation rows, so it installs no
    # mutation runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install stable Rust and analysis components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - &install-nats
        name: Install pinned nats-server v2.15.0
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$RUNNER_OS:$RUNNER_ARCH" in
            Linux:X64) platform=linux-amd64; sha=5d2c51caca950333aba84911df7d377f826f3a59ec36061c6539105084f65c92 ;;
            Linux:ARM64) platform=linux-arm64; sha=cdc208f5a3f42963a52b6ab06ef65626bb870315dc936e26ba571780c6351112 ;;
            macOS:X64) platform=darwin-amd64; sha=5bd8b59ca5bf93fab3da2c5843cf564cd6e2e291e22ae3b861746e7ebe259b95 ;;
            macOS:ARM64) platform=darwin-arm64; sha=e1c4e22d70bd44abfa0bcb3c16f7cf0c66f648c2e728c58924e8a1ce88913cc8 ;;
            *) echo "No pinned NATS archive for $RUNNER_OS:$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          archive="nats-server-v2.15.0-$platform.tar.gz"
          curl --fail --location --retry 3 "https://github.com/nats-io/nats-server/releases/download/v2.15.0/$archive" -o "$RUNNER_TEMP/$archive"
          if [[ "$RUNNER_OS" == Linux ]]; then
            echo "$sha  $RUNNER_TEMP/$archive" | sha256sum --check -
          else
            echo "$sha  $RUNNER_TEMP/$archive" | shasum -a 256 --check -
          fi
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nats-server-v2.15.0-$platform" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nats-server-v2.15.0-$platform/nats-server" --version
      - name: Record installed Rust version
        id: rust
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo build cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-checks-main-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-checks-main-
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-checks-
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-
      - &restored-build-size
        name: Measure restored build folder
        shell: bash
        run: du -sk target 2>/dev/null || test ! -d target
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: matrix.platform != 'linux-arm64'
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ckdev-mutate${{ runner.os == 'Windows' && '.exe' || '' }}
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ steps.rust.outputs.version }}-${{ env.CK_MUTATE_REV }}
      - name: Install pinned mutation runner
        if: matrix.platform != 'linux-arm64' && steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CK_MUTATE_REV" cortexkit-mutate
      - name: Save pinned mutation runner
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.platform != 'linux-arm64' && steps.mutate-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/bin/ckdev-mutate${{ runner.os == 'Windows' && '.exe' || '' }}
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ steps.rust.outputs.version }}-${{ env.CK_MUTATE_REV }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: matrix.platform == 'linux'
      - run: cargo clippy --workspace --all-targets --features basal-module/rig-kill-hook -- -D warnings
      - name: Test portable crates
        if: runner.os == 'Linux'
        run: cargo test --locked -p basal-proto -p basal-core -p basal-host
      # The module feature propagates to basal-host, so portable tests need both
      # modes as well. Enable it on the selected host crate without selecting the
      # worker-using module. The hook's Linux tests run on x86_64; aarch64
      # retains production-mode tests and hook-enabled clippy coverage.
      - name: Test portable crates with the rig kill hook
        if: matrix.platform == 'linux'
        run: cargo test --locked -p basal-proto -p basal-core -p basal-host --features basal-host/rig-kill-hook
      # A procfs mounted with hidepid hides the confined worker from its parent,
      # and the Linux startup tests then accept a weaker self-reported status.
      # GitHub's runners show every process, so require the exact parent-side
      # /proc/<pid>/status readback here; the variable has no effect on macOS.
      - name: Test confined worker packages
        env:
          BASAL_REQUIRE_VISIBLE_PROC: ${{ runner.os == 'Linux' && '1' || '' }}
        run: cargo test --locked -p basal-worker -p basal-module -p basal-testkit -p basal-rig
      - name: Test confined worker packages with the rig kill hook
        if: matrix.platform != 'linux-arm64'
        env:
          BASAL_REQUIRE_VISIBLE_PROC: ${{ runner.os == 'Linux' && '1' || '' }}
        run: cargo test --locked -p basal-worker -p basal-module -p basal-testkit -p basal-rig --features basal-module/rig-kill-hook
      # `ckdev-mutate check` validates every catalogue row's anchors and test
      # names. Listing test names compiles the test binaries but runs no test,
      # so no worker starts. Rows marked for the other OS are skipped, so each
      # host validates the rows it will replay.
      - run: ckdev-mutate check
        if: matrix.platform != 'linux-arm64'
      - &final-build-size
        name: Measure final build folder
        shell: bash
        run: du -sk target
      # Cache entries are immutable. Only main publishes a new run-scoped entry;
      # PRs read the newest main prefix without consuming cache quota.
      - name: Save Cargo build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-checks-main-${{ github.run_id }}

  # Native aarch64 evidence for the Linux seccomp allowlist. The filter has a
  # separate aarch64 syscall table, and only a native trace shows which calls
  # glibc and the release worker actually make there. The script fails when no
  # confined worker was traced or a panic/abort probe misbehaves; its reduced
  # traces are uploaded for review against
  # crates/basal-worker/sandbox/linux/syscall-admission.md.
  aarch64-syscall-trace:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust and strace
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends strace
      - name: Trace the native release worker
        run: |
          rm -rf crates/basal-worker/sandbox/linux/traces/aarch64
          env -u BASAL_WORKER_BIN bash crates/basal-worker/sandbox/linux/trace-native.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: syscall-trace-aarch64
          path: crates/basal-worker/sandbox/linux/traces/aarch64
          if-no-files-found: error

  mutations-pr:
    if: github.event_name == 'pull_request'
    needs: [checks, lint]
    defaults:
      run:
        shell: bash
    # Replays the mutation controls whose files this pull request changes.
    # Every catalogue row is marked for exactly one OS, so running the replay
    # on all three platforms covers every changed control without running any twice.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: matrix.platform == 'windows'
        with:
          python-version: '3.12'
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - *install-nats
      - &install-nats-windows
        name: Install pinned nats-server v2.15.0
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          switch ($env:RUNNER_ARCH) {
            'X64' { $platform = 'windows-amd64'; $sha = '2d0861dc2ca3567d17f7d19611d7b346cc2ccbd7086a0a77cc957a2c71663200' }
            'ARM64' { $platform = 'windows-arm64'; $sha = 'd468fa3f0ac953bed2219e37a2b5977d87cb8d705d5bbdc70b9f960e12fb7c38' }
            default { throw "No pinned NATS archive for $env:RUNNER_ARCH" }
          }
          $archive = "nats-server-v2.15.0-$platform.zip"
          $path = Join-Path $env:RUNNER_TEMP $archive
          Invoke-WebRequest "https://github.com/nats-io/nats-server/releases/download/v2.15.0/$archive" -OutFile $path
          if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha) { throw 'NATS archive SHA256 mismatch' }
          Expand-Archive $path -DestinationPath $env:RUNNER_TEMP
          $bin = Join-Path $env:RUNNER_TEMP "nats-server-v2.15.0-$platform"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $bin 'nats-server.exe') --version
      - name: Record installed Rust version
        id: rust
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      # Main's checks publish this run's cache before replay starts. PR checks
      # do not save, so PR replays restore the newest main entry by prefix.
      # Windows has no checks leg; its fallback uses the Windows baseline.
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-checks-main-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-checks-main-
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-windows-baseline-windows-2022-main-${{ github.run_id }}-module-core-testkit-rig
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-windows-baseline-windows-2022-main-
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-windows-baseline-windows-2022-
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-checks-
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-
      - *restored-build-size
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ckdev-mutate${{ runner.os == 'Windows' && '.exe' || '' }}
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ steps.rust.outputs.version }}-${{ env.CK_MUTATE_REV }}
      - name: Install pinned mutation runner
        if: steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CK_MUTATE_REV" cortexkit-mutate
      - &save-mutation-runner
        name: Save pinned mutation runner
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.mutate-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/bin/ckdev-mutate${{ runner.os == 'Windows' && '.exe' || '' }}
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ steps.rust.outputs.version }}-${{ env.CK_MUTATE_REV }}
      - name: Replay proofs selected by the PR diff
        run: |
          mkdir -p target/mutations
          rm -f target/mutations/diff.json
          env -u BASAL_WORKER_BIN -u BASAL_CUT_EXHAUSTIVE ckdev-mutate run --diff origin/main --report target/mutations/diff.json
      - name: Capture exact Windows mutation application and restoration witnesses
        if: matrix.platform == 'windows'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          import subprocess
          import sys

          sys.path.insert(0, "script")
          import mutation_catalogue

          rows, _ = mutation_catalogue.load(Path.cwd())
          windows_ids = {row["id"] for row in rows if row["platforms"] == ["windows"]}
          report = json.loads(Path("target/mutations/diff.json").read_text())
          selected = sorted({row["id"] for row in report} & windows_ids)
          if not selected:
              print("Skipping Windows witnesses: the PR diff selected no Windows catalogue rows.")
          else:
              command = [sys.executable, "script/witness-mutations.py", "--platform", "windows",
                         "--output", str(Path(os.environ["RUNNER_TEMP"]) / "windows-mutation-evidence")]
              for row_id in selected:
                  command.extend(["--only", row_id])
              subprocess.run(command, check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.platform == 'windows'
        with:
          name: windows-mutation-evidence-pr
          path: ${{ runner.temp }}/windows-mutation-evidence
      - *final-build-size
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ${{ matrix.platform == 'windows' && 'mutations-windows-1' || format('mutations-pr-{0}', matrix.platform) }}
          path: target/mutations/diff.json

  # On a push to main: the full catalogue, each row against its own target.
  # Nightly or on demand: the same catalogue with `--broad`.
  # always() lets the scheduled matrix proceed past the skipped checks job;
  # push and manual runs still require those checks to succeed.
  mutation-matrix:
    if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.checks.result == 'success' && needs.lint.result == 'success') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && needs.checks.result == 'success' && needs.lint.result == 'success'))
    needs: [checks, lint]
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select event-specific mutation shards
        id: matrix
        run: python3 .github/workflows/mutation_matrix.py --event "$EVENT_NAME" >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}

  mutations-main:
    if: always() && needs.mutation-matrix.result == 'success'
    needs: mutation-matrix
    defaults:
      run:
        shell: bash
    # The matrix job retains the event filter and prerequisite checks gate.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Scheduled breadth needs shorter shards to stay below the hosted
        # runner's six-hour limit. Push and manual runs use eight Linux shards.
        # Every host shards the entire sorted catalogue independently;
        # rows for other platforms are reported as skips, not built.
        include: ${{ fromJSON(needs.mutation-matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: matrix.platform == 'windows'
        with:
          python-version: '3.12'
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - *install-nats
      - *install-nats-windows
      - name: Record installed Rust version
        id: rust
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-checks-main-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-checks-main-
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-windows-baseline-windows-2022-main-${{ github.run_id }}-module-core-testkit-rig
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-windows-baseline-windows-2022-main-
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-windows-baseline-windows-2022-
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-checks-
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-
      - *restored-build-size
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ckdev-mutate${{ runner.os == 'Windows' && '.exe' || '' }}
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ steps.rust.outputs.version }}-${{ env.CK_MUTATE_REV }}
      - name: Install pinned mutation runner
        if: steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CK_MUTATE_REV" cortexkit-mutate
      - *save-mutation-runner
      - name: Replay the full catalogue in an isolated shard
        run: |
          mkdir -p target/mutations
          rm -f target/mutations/all.json
          env -u BASAL_WORKER_BIN -u BASAL_CUT_EXHAUSTIVE ckdev-mutate run --all --shard ${{ matrix.shard }}/${{ matrix.shards }} ${BROAD:+--broad} --report target/mutations/all.json
        env:
          BROAD: ${{ github.event_name != 'push' && 'true' || '' }}
      - name: Capture exact Windows mutation application and restoration witnesses
        if: matrix.platform == 'windows'
        run: python script/witness-mutations.py --platform windows --shard ${{ matrix.shard }}/${{ matrix.shards }} --output "$RUNNER_TEMP/windows-mutation-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.platform == 'windows'
        with:
          name: windows-mutation-evidence-${{ matrix.shard }}
          path: ${{ runner.temp }}/windows-mutation-evidence
      - *final-build-size
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutations-${{ matrix.platform }}-${{ matrix.shard }}
          path: target/mutations/all.json

  # Reads every shard's replay report (target/mutations/all.json) after all
  # hosts finish, and requires exactly one successful replay of each
  # catalogue row across all of them. A row skipped everywhere, missing from
  # every report or replayed twice fails here, even if each shard passed.
  mutation-coverage:
    if: always() && needs.mutations-main.result != 'skipped'
    needs: mutations-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutations-*
          path: target/mutation-reports
      - name: Require one successful replay for every catalogue row
        run: |
          python3 --version
          python3 .github/workflows/check_mutation_coverage.py --reports target/mutation-reports

  minimum-rust:
    if: github.event_name != 'schedule'
    # Builds every workspace target at the declared minimum Rust version. It
    # only compiles, so it needs no macOS: nothing here starts the flow
    # worker, whose sandbox exists on macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the declared minimum Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Record installed Rust version
        id: rust
        run: echo "version=$(rustc +1.88.0 --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo build cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-minimum-main-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-minimum-main-
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-minimum-
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-
      - *restored-build-size
      - name: Build every target with the declared minimum Rust
        run: |
          cargo +1.88.0 check --workspace --all-targets --locked
          cargo +1.88.0 check --workspace --all-targets --locked --features basal-module/rig-kill-hook
      - *final-build-size
      - name: Save Cargo build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-minimum-main-${{ github.run_id }}

  # Each Windows image leaves a different set of loader and thread-pool handles
  # in the worker, so both must exercise the startup allowlist. Native suites
  # also exercise the launcher, worker probes and filesystem/Git guards. Two
  # package groups run in parallel per image; logs survive failed gates.
  windows-baseline:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
        suite: [launch-worker-host, module-core-testkit-rig]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - *install-nats-windows
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Record installed Rust version
        id: rust
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo build cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-windows-baseline-${{ matrix.os }}-main-${{ github.run_id }}-${{ matrix.suite }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-windows-baseline-${{ matrix.os }}-main-
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-windows-baseline-${{ matrix.os }}-
      - *restored-build-size
      - name: Prepare the log directory
        run: mkdir -p "$RUNNER_TEMP/windows-baseline"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: matrix.os == 'windows-2022' && matrix.suite == 'module-core-testkit-rig'
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ckdev-mutate.exe
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ steps.rust.outputs.version }}-${{ env.CK_MUTATE_REV }}
      - name: Install pinned mutation runner
        if: matrix.os == 'windows-2022' && matrix.suite == 'module-core-testkit-rig' && steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CK_MUTATE_REV" cortexkit-mutate 2>&1 | tee "$RUNNER_TEMP/windows-baseline/install-mutate.log"
      - name: Save pinned mutation runner
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'windows-2022' && matrix.suite == 'module-core-testkit-rig' && steps.mutate-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/bin/ckdev-mutate.exe
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ steps.rust.outputs.version }}-${{ env.CK_MUTATE_REV }}
      - name: Verify the pinned mutation runner on Windows
        if: matrix.os == 'windows-2022' && matrix.suite == 'module-core-testkit-rig'
        run: |
          ckdev-mutate --version 2>&1 | tee "$RUNNER_TEMP/windows-baseline/mutate-version.log"
          ckdev-mutate check 2>&1 | tee "$RUNNER_TEMP/windows-baseline/mutate-check.log"
      # The Windows launcher's own tests start real confined children, so
      # they can only run here. The deviations feature adds the test-only
      # launch variants, one per confinement check. They run first and print
      # what the parent read back, so the log shows it even when the
      # workspace steps below fail.
      - name: Test the Windows launcher with its test variants
        if: matrix.suite == 'launch-worker-host'
        id: test-launch
        timeout-minutes: 20
        run: |
          cargo test -p basal-launch --locked -- --show-output 2>&1 | tee "$RUNNER_TEMP/windows-baseline/test-basal-launch-production.log"
          cargo test -p basal-launch --features deviations --locked -- --show-output 2>&1 | tee "$RUNNER_TEMP/windows-baseline/test-basal-launch.log"
      # The worker's tests on their own: its Windows startup checks, its image
      # and a real activation, each worker started through the launcher. The
      # plain build is the production worker, which must refuse the
      # launcher's request to skip a check. The deviations build is a test
      # worker that honours that request, for the three checks the parent
      # cannot break from outside.
      - name: Test the worker on its own
        if: matrix.suite == 'launch-worker-host'
        id: test-worker
        timeout-minutes: 30
        run: cargo test -p basal-worker --locked --no-fail-fast -- --show-output 2>&1 | tee "$RUNNER_TEMP/windows-baseline/test-basal-worker.log"
      # The creators and counts of production startup handles are measured
      # once per Windows runner image. Every worker startup still compares its
      # live handle table with the fixed per-image count limits; the image test
      # rejects DLL imports absent from the worker's windows-imports.txt file.
      - name: Witness the startup-handle and import-inventory mutants
        if: matrix.suite == 'launch-worker-host'
        timeout-minutes: 10
        run: python crates/basal-worker/tests/windows_mutation_witness.py "$RUNNER_TEMP/windows-baseline"
      - name: Test the worker with its test variants
        if: matrix.suite == 'launch-worker-host'
        id: test-worker-deviations
        timeout-minutes: 30
        run: cargo test -p basal-worker --features deviations --locked --no-fail-fast -- --show-output 2>&1 | tee "$RUNNER_TEMP/windows-baseline/test-basal-worker-deviations.log"
      # The module's tests: workers started, supervised and killed through
      # the launcher; worker deaths from a confinement fault (an invalid
      # handle or access violation) counted apart from other crashes; and
      # the store directory and database readable by their owner only.
      # basal-core's tests run with them: the module's store and runtime
      # are basal-core's.
      - name: Test the module and the core
        if: matrix.suite == 'module-core-testkit-rig'
        id: test-module
        timeout-minutes: 40
        run: cargo test -p basal-module -p basal-core --locked --no-fail-fast -- --show-output 2>&1 | tee "$RUNNER_TEMP/windows-baseline/test-basal-module.log"
      - name: Test the shared test kit on its own
        if: matrix.suite == 'module-core-testkit-rig'
        id: test-testkit
        timeout-minutes: 30
        run: cargo test -p basal-testkit --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/windows-baseline/test-basal-testkit.log"
      - name: Test the integration rig on its own
        if: matrix.suite == 'module-core-testkit-rig'
        id: test-rig
        timeout-minutes: 30
        run: cargo test -p basal-rig --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/windows-baseline/test-basal-rig.log"
      - name: Check every workspace target
        if: matrix.suite == 'module-core-testkit-rig'
        id: check
        timeout-minutes: 40
        run: cargo check --workspace --all-targets --locked 2>&1 | tee "$RUNNER_TEMP/windows-baseline/check.log"
      - name: Check every workspace target, continuing past failed crates
        if: failure() && matrix.suite == 'module-core-testkit-rig' && steps.check.outcome == 'failure'
        timeout-minutes: 40
        run: cargo check --workspace --all-targets --locked --keep-going 2>&1 | tee "$RUNNER_TEMP/windows-baseline/check-keep-going.log"
      # The rest of the workspace: every package not already tested by its own
      # step above. Testing those again doubled the job's time, and on a slow
      # runner pushed this step past its limit.
      - name: Test the workspace
        if: matrix.suite == 'launch-worker-host'
        id: test
        timeout-minutes: 40
        run: cargo test --workspace --exclude basal-launch --exclude basal-worker --exclude basal-module --exclude basal-core --exclude basal-testkit --exclude basal-rig --locked 2>&1 | tee "$RUNNER_TEMP/windows-baseline/test.log"
      - name: Test the workspace, continuing past failed tests
        if: failure() && matrix.suite == 'launch-worker-host' && steps.test.outcome == 'failure'
        timeout-minutes: 40
        run: cargo test --workspace --exclude basal-launch --exclude basal-worker --exclude basal-module --exclude basal-core --exclude basal-testkit --exclude basal-rig --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/windows-baseline/test-no-fail-fast.log"
      - *final-build-size
      - name: Save Cargo build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ steps.rust.outputs.version }}-windows-baseline-${{ matrix.os }}-main-${{ github.run_id }}-${{ matrix.suite }}
      - name: Summarize the Windows gates
        if: always()
        run: |
          {
            echo "## Windows gates (${{ matrix.os }}, ${{ matrix.suite }}, $(rustc --version))"
            echo
            echo "- cargo check --workspace --all-targets --locked: ${{ steps.check.outcome }}"
            echo "- cargo test --workspace --locked: ${{ steps.test.outcome }}"
            echo "- cargo test -p basal-launch --features deviations --locked: ${{ steps.test-launch.outcome }}"
            echo "- cargo test -p basal-module -p basal-core --locked --no-fail-fast: ${{ steps.test-module.outcome }}"
            echo "- cargo test -p basal-worker --locked: ${{ steps.test-worker.outcome }}"
            echo "- cargo test -p basal-worker --features deviations --locked: ${{ steps.test-worker-deviations.outcome }}"
            echo "- cargo test -p basal-testkit --locked --no-fail-fast: ${{ steps.test-testkit.outcome }}"
            echo "- cargo test -p basal-rig --locked --no-fail-fast: ${{ steps.test-rig.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-baseline-logs-${{ matrix.os }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/windows-baseline
          if-no-files-found: error

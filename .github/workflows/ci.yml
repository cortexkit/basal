name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The nightly breadth audit: the full catalogue with `--broad`, which runs
  # each mutant against every test target in its package. That reveals a
  # control whose mutant breaks unrelated tests (CAUGHT_BROADLY), which a
  # normal replay of the row's own target cannot see.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the older run. On main every
# commit gets its full catalogue replay, and the nightly audit always
# finishes, so a later run never cancels either.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  CK_MUTATE_REV: 695c97b6c4d74042011ec0aeeebe966f377353be

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust and analysis components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-checks-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-checks-
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ck-mutate
          key: ${{ runner.os }}-${{ runner.arch }}-ck-mutate-${{ env.CK_MUTATE_REV }}
      - name: Install pinned mutation runner
        if: steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CK_MUTATE_REV" cortexkit-mutate
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features basal-module/rig-kill-hook -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check shell scripts
        run: |
          command -v shellcheck || brew install shellcheck
          shellcheck -x script/*.sh
      - name: Check offline flow rig contracts
        run: python3 -m unittest script.tests.flows_rig -v
      - name: Check Cargo path dependency boundary
        run: |
          python3 script/check-path-deps.py
          python3 -m unittest script.tests.check_path_deps -v
      - name: Check offline placement cards
        run: |
          /bin/sh -n script/stage.sh
          python3 -m unittest script.tests.stage_card -v
      - run: ck-mutate check

  mutations-pr:
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # Restore the build the checks job saved for this commit and never save
      # a second copy: the repository's cache quota holds only a few target
      # directories.
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-checks-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-checks-
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ck-mutate
          key: ${{ runner.os }}-${{ runner.arch }}-ck-mutate-${{ env.CK_MUTATE_REV }}
      - name: Install pinned mutation runner
        if: steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CK_MUTATE_REV" cortexkit-mutate
      - name: Replay proofs selected by the PR diff
        run: |
          mkdir -p target/mutations
          rm -f target/mutations/diff.json
          env -u BASAL_WORKER_BIN -u BASAL_CUT_EXHAUSTIVE ck-mutate run --diff origin/main --report target/mutations/diff.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutations-pr
          path: target/mutations/diff.json

  # On a push to main: the full catalogue, each row against its own target.
  # Nightly or on demand: the same catalogue with `--broad`.
  mutations-main:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # GitHub runs at most five macOS jobs at once for this account, so
        # five shards replay the catalogue in one wave. More shards would only
        # queue, and each one pays its own checkout and cache restore.
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-checks-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-checks-
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ck-mutate
          key: ${{ runner.os }}-${{ runner.arch }}-ck-mutate-${{ env.CK_MUTATE_REV }}
      - name: Install pinned mutation runner
        if: steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CK_MUTATE_REV" cortexkit-mutate
      - name: Replay the full catalogue in an isolated shard
        run: |
          mkdir -p target/mutations
          rm -f target/mutations/all.json
          env -u BASAL_WORKER_BIN -u BASAL_CUT_EXHAUSTIVE ck-mutate run --all --shard ${{ matrix.shard }}/5 ${BROAD:+--broad} --report target/mutations/all.json
        env:
          BROAD: ${{ github.event_name != 'push' && 'true' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutations-${{ github.event_name == 'push' && 'main' || 'broad' }}-${{ matrix.shard }}
          path: target/mutations/all.json

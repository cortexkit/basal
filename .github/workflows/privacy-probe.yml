name: Temporary macOS responsibility probe

on:
  push:
    branches: [ci/privacy-probe]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsibility:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          rustc --version --verbose
          sw_vers
      - name: Install pinned nats-server v2.15.0 for the concurrent workspace run
        run: |
          case "$RUNNER_ARCH" in
            X64) platform=darwin-amd64; sha=5bd8b59ca5bf93fab3da2c5843cf564cd6e2e291e22ae3b861746e7ebe259b95 ;;
            ARM64) platform=darwin-arm64; sha=e1c4e22d70bd44abfa0bcb3c16f7cf0c66f648c2e728c58924e8a1ce88913cc8 ;;
            *) exit 1 ;;
          esac
          archive="nats-server-v2.15.0-$platform.tar.gz"
          curl --fail --location "https://github.com/nats-io/nats-server/releases/download/v2.15.0/$archive" -o "$RUNNER_TEMP/$archive"
          echo "$sha  $RUNNER_TEMP/$archive" | shasum -a 256 --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nats-server-v2.15.0-$platform" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nats-server-v2.15.0-$platform/nats-server" --version
      - name: Build workspace tests and spawn-path interposer
        run: |
          cargo test --locked --workspace --no-run --message-format=json > "$RUNNER_TEMP/build.jsonl"
          clang --version
          clang -Wall -Wextra -Werror -dynamiclib script/privacy-spawn-probe.c -o "$RUNNER_TEMP/privacy-spawn-probe.dylib"
          clang -Wall -Wextra -Werror script/privacy-launch.c -o "$RUNNER_TEMP/privacy-launch"
      - name: Prove both responsibility mutation controls
        run: |
          python3 --version
          cargo --version
          python3 script/privacy-mutation-probe.py
      - name: Verify restored macOS test and rebuild clean binaries
        run: |
          cargo fmt --all --check
          cargo clippy --locked -p basal-module --test e2e -- -D warnings
          cargo test --locked -p basal-module --test e2e
          cargo test --locked --workspace --no-run --message-format=json > "$RUNNER_TEMP/build.jsonl"
      - name: Reproduce under CPU and concurrent e2e load
        env:
          BASAL_PRIVACY_TRACE: '1'
        run: python3 script/privacy-probe.py
      - name: Upload every run, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: privacy-responsibility-probe
          path: |
            ${{ runner.temp }}/privacy-probe
            ${{ runner.temp }}/privacy-mutations

name: Windows confinement experiment

on:
  push:
    branches: [spike/windows-confinement]

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spikes/win-confine
        shell: pwsh
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version
          cargo --version
          python --version
      - name: Check, test and build standalone binary
        run: |
          cargo fmt --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fetch --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo check --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest -v test_evidence test_reference test_procmon test_gaps
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --release --locked
          exit $LASTEXITCODE
      - name: Witness token-handle fence on a live token
        run: |
          python mutation_witness.py
          exit $LASTEXITCODE
      - name: Import and delay-import inventory
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          $toolset = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $dumpbin = Join-Path $toolset.FullName 'bin\Hostx64\x64\dumpbin.exe'
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" && cl /Bv context_layout.c /Fe:target\context-layout.exe /Fo:target\context-layout.obj"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & target/context-layout.exe | Tee-Object evidence/context-layout.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $dumpbin /imports /dependents target\release\win-confine.exe | Tee-Object evidence\imports.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python pe_inventory.py target/release/win-confine.exe evidence/imports.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $dumpbin /imports /dependents target\release\win-confine-gui.exe | Out-File evidence/imports-gui.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python pe_inventory.py target/release/win-confine-gui.exe evidence/imports-gui.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "import json; assert json.load(open('evidence/imports.json'))['subsystem'] == 3; assert json.load(open('evidence/imports-gui.json'))['subsystem'] == 2; print('PE subsystem check: 2 images passed (CUI=3, GUI=2)')"
          exit $LASTEXITCODE
      - name: Measure pre-input ambient handles from the parent
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $candidates = @(Get-ChildItem $kits -Filter dbghelp.dll -Recurse -ErrorAction SilentlyContinue | Where-Object { Test-Path (Join-Path $_.DirectoryName 'symsrv.dll') })
          $toolkit = $candidates | Where-Object { $_.FullName -match '\\Debuggers\\x64\\dbghelp.dll$' } | Select-Object -First 1
          if (-not $toolkit) { $toolkit = $candidates | Where-Object { $_.FullName -notmatch '\\x86\\|\\arm64\\' } | Select-Object -First 1 }
          if ($toolkit) {
            $env:BASAL_DBGHELP = $toolkit.FullName
            $env:BASAL_SYMSRV = Join-Path $toolkit.DirectoryName 'symsrv.dll'
            $symchk = Join-Path $toolkit.DirectoryName 'symchk.exe'
            if (Test-Path $symchk) {
              New-Item -ItemType Directory -Force evidence/symbols | Out-Null
              foreach ($dll in @('ntdll.dll', 'kernelbase.dll', 'rpcrt4.dll', 'sechost.dll', 'bcrypt.dll')) {
                & $symchk /v "$env:SystemRoot\System32\$dll" /s "SRV*$PWD\evidence\symbols*https://msdl.microsoft.com/download/symbols" 2>&1 | Out-File "evidence/symchk-$dll.txt"
                "symchk exit: $LASTEXITCODE" | Out-File -Append "evidence/symchk-$dll.txt"
              }
            }
          }
          $candidates | Select-Object FullName, @{n='Version';e={$_.VersionInfo.FileVersion}} | ConvertTo-Json | Out-File evidence/symbol-toolkit.json
          systeminfo | Out-File evidence/host.txt
          whoami /all | Out-File -Append evidence/host.txt
          & target/release/win-confine.exe --output evidence/report.json 2> evidence/parent-stderr.txt
          $measurementExit = $LASTEXITCODE
          $ifeo = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\win-confine-gui.exe'
          "GUI IFEO exists after campaign: $(Test-Path $ifeo)" | Out-File evidence/loader-threads-cleanup.txt
          exit $measurementExit
      - name: Retain and validate complete gap measurements
        if: always()
        run: |
          if (Test-Path evidence/report.json) {
            python retain_gaps.py evidence/report.json evidence/gaps $env:GITHUB_RUN_ID $env:GITHUB_SHA '${{ matrix.os }}'
            exit $LASTEXITCODE
          }
          throw 'No report: thread/scheduler coverage is unknown'
      - name: Print residual and comparison
        if: always()
        run: |
          if (Test-Path evidence/report.json) {
            python retain_handles.py evidence evidence/handles $env:GITHUB_RUN_ID $env:GITHUB_SHA '${{ matrix.os }}'
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            python summarize.py evidence/report.json | Tee-Object evidence/summary.md
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Get-Content evidence/summary.md >> $env:GITHUB_STEP_SUMMARY
            python validate.py evidence/report.json
            exit $LASTEXITCODE
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: win-confine-${{ matrix.os }}
          path: |
            spikes/win-confine/evidence/gaps/
            spikes/win-confine/evidence/handles/*-manifest.json
            spikes/win-confine/evidence/imports*.json
            spikes/win-confine/evidence/parent-stderr.txt
            spikes/win-confine/evidence/host.txt
            spikes/win-confine/evidence/context-layout.txt
          if-no-files-found: error

name: Windows confinement experiment

on:
  push:
    branches: [spike/windows-confinement]

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spikes/win-confine
        shell: pwsh
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version
          cargo --version
          python --version
      - name: Check, test and build standalone binary
        run: |
          cargo fmt --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo check --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest -v test_evidence test_reference
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --release --locked
          exit $LASTEXITCODE
      - name: Witness token-handle fence on a live token
        run: |
          python mutation_witness.py
          exit $LASTEXITCODE
      - name: Import and delay-import inventory
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          $toolset = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $dumpbin = Join-Path $toolset.FullName 'bin\Hostx64\x64\dumpbin.exe'
          & $dumpbin /imports /dependents target\release\win-confine.exe | Tee-Object evidence\imports.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python pe_inventory.py target/release/win-confine.exe evidence/imports.json
          exit $LASTEXITCODE
      - name: Measure sandbox-enabled Chrome from the parent
        run: ./chrome_reference.ps1
      - name: Measure all three modes with image-specific loader snaps
        run: |
          systeminfo | Out-File evidence/host.txt
          whoami /all | Out-File -Append evidence/host.txt
          $ifeo = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\win-confine.exe'
          if (Test-Path $ifeo) { throw 'Refusing to overwrite an existing image-specific IFEO key' }
          try {
            New-Item $ifeo -Force | Out-Null
            New-ItemProperty $ifeo -Name GlobalFlag -PropertyType String -Value '0x00000002' | Out-Null
            Get-ItemProperty $ifeo | Out-File evidence/loader-snaps-setting.txt
            & target\release\win-confine.exe --output evidence/report.json
            $measurementExit = $LASTEXITCODE
          } finally {
            Remove-Item $ifeo -Recurse -Force
            "IFEO exists after cleanup: $(Test-Path $ifeo)" | Out-File evidence/loader-snaps-cleanup.txt
          }
          exit $measurementExit
      - name: Print residual and comparison
        if: always()
        run: |
          if (Test-Path evidence/report.json) {
            python compare_reference.py evidence evidence/reference-diff.json
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            python summarize.py evidence/report.json | Tee-Object evidence/summary.md
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Get-Content evidence/summary.md >> $env:GITHUB_STEP_SUMMARY
            python validate.py evidence/report.json
            exit $LASTEXITCODE
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: win-confine-${{ matrix.os }}
          path: spikes/win-confine/evidence/
          if-no-files-found: error

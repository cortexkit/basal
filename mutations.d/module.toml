# basal-module: the module process, its ops, worker pool and tool provider.

[[control]]
id = "policy-capability-not-declared"
guards = "core policy installs require basal's capability declaration"
test_file = "crates/basal-module/tests/install_policy.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test install_policy"
expect_red = ["declares_flow_install_policy_capability"]
only = false
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-module/src/manifest.rs"
old = '"flow-install-policy/v1".into(),'
new = '"flow-install-policy-disabled/v1".into(), // NON-VACUITY BREAK'

[[control]]
id = "policy-startup-recovery-skipped"
guards = "startup recovers approvals whose install replies were lost"
test_file = "crates/basal-module/tests/install_policy.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test install_policy"
expect_red = ["startup_checks_every_undecided_card_and_pending_policy_once"]
only = false
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-module/src/module.rs"
old = '''rt.recover_cardless_installs()
            .map_err(|e| format!("recovering pending installs: {e}"))?;'''
new = '// NON-VACUITY BREAK: startup confirmation omitted'

[[control]]
id = "policy-idle-recovery-polls"
guards = "idle basal never polls install status, including pending policy installs"
test_file = "crates/basal-module/tests/install_policy.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test install_policy"

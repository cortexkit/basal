[[control]]
id = "windows-plain-spawn-releases-lock-before-creation"
guards = "windows plain spawn releases lock before creation"
test_file = "crates/basal-launch/src/windows/plain/tests.rs"
runner = "cargo"
package = "basal-launch"
platforms = ["windows"]
target = "--lib"
expect_red = ["windows::plain::tests::the_child_is_created_suspended_under_the_lock_inheriting_only_its_stdio"]
only = false
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-launch/src/windows/plain.rs"
old = "    let mut info: PROCESS_INFORMATION = unsafe { zeroed() };\n    check(\n        unsafe {\n            CreateProcessW(\n                application.as_ptr(),\n                command_line.as_mut_ptr(),\n                null(),\n                null(),\n                1,\n                CREATION_FLAGS,\n                environment.as_ptr().cast::<c_void>(),\n                cwd.as_ref().map_or(null(), |cwd| cwd.as_ptr()),\n                &startup.StartupInfo,\n                &mut info,\n            )\n        },\n        \"CreateProcessW\",\n    )?;\n    let created = Created {\n        process: unsafe { OwnedHandle::from_raw_handle(info.hProcess) },\n        thread: unsafe { OwnedHandle::from_raw_handle(info.hThread) },\n    };\n    #[cfg(test)]\n    tests::observe(&created, &inherited);\n    // The child holds its own copies now. Closing the parent's before the\n    // lock is released ends the window in which another spawn could copy\n    // them, and lets the pipes report end of file when the child exits.\n    drop(attributes);\n    let [stdin, stdout, stderr] = [stdin, stdout, stderr].map(Stdio::close_child);\n    drop(spawn_lock);"
new = "    drop(spawn_lock); // NON-VACUITY BREAK\n    let mut info: PROCESS_INFORMATION = unsafe { zeroed() };\n    check(\n        unsafe {\n            CreateProcessW(\n                application.as_ptr(),\n                command_line.as_mut_ptr(),\n                null(),\n                null(),\n                1,\n                CREATION_FLAGS,\n                environment.as_ptr().cast::<c_void>(),\n                cwd.as_ref().map_or(null(), |cwd| cwd.as_ptr()),\n                &startup.StartupInfo,\n                &mut info,\n            )\n        },\n        \"CreateProcessW\",\n    )?;\n    let created = Created {\n        process: unsafe { OwnedHandle::from_raw_handle(info.hProcess) },\n        thread: unsafe { OwnedHandle::from_raw_handle(info.hThread) },\n    };\n    #[cfg(test)]\n    tests::observe(&created, &inherited);\n    // The child holds its own copies now. Closing the parent's before the\n    // lock is released ends the window in which another spawn could copy\n    // them, and lets the pipes report end of file when the child exits.\n    drop(attributes);\n    let [stdin, stdout, stderr] = [stdin, stdout, stderr].map(Stdio::close_child);\n"


# basal-launch: the Windows launcher's token, profile and process setup.

# Before resume the parent checks the suspended child's job and tokens.
# Process creation fixes its mitigation bits; all spawns share one lock while
# their child's standard handles are inheritable.

[[control]]
id = "windows-parent-skips-job-limits-mismatch"
guards = "windows parent skips job limits mismatch"
test_file = "crates/basal-launch/tests/windows_launch.rs"
runner = "cargo"
package = "basal-launch"
platforms = ["windows"]
target = "--test windows_launch"
features = ["deviations"]
expect_red = ["deviations::a_job_with_other_limits_is_refused_as_job_limits_mismatch"]
only = false
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-launch/src/windows/launch.rs"
old = "if limits != required {"
new = "if false && limits != required { // NON-VACUITY BREAK"


[[control]]
id = "windows-confined-spawn-releases-lock-before-creation"
guards = "The full launcher holds the shared spawn lock until its inheritable pipe ends close"
test_file = "crates/basal-launch/tests/windows_launch.rs"
runner = "cargo"
package = "basal-launch"
platforms = ["windows"]
target = "--test windows_launch"
features = ["deviations"]
expect_red = ["deviations::a_confined_child_is_created_under_the_shared_spawn_lock"]
only = false
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-launch/src/windows/launch.rs"
old = "    let spawned = match deviation.shape() {\n        Shape::Confined => spawn_confined(\n            options,\n            commit_bytes,\n            &package,\n            parent_token.as_raw_handle(),\n            &context,\n            &inherited,\n            &mut command,\n        )?,\n        #[cfg(feature = \"deviations\")]\n        Shape::LpacOnly | Shape::Plain => spawn_control(\n            options,\n            &package,\n            &context,\n            &inherited,\n            &mut command,\n            deviation.shape() == Shape::LpacOnly,\n        )?,\n    };\n\n    // The child has inherited its own copies of its three pipe ends; the\n    // parent's copies would keep the pipes open after the child exits.\n    drop((child_stdin, child_stdout, child_stderr));\n    drop(spawn_lock);"
new = "    drop(spawn_lock); // NON-VACUITY BREAK\n    let spawned = match deviation.shape() {\n        Shape::Confined => spawn_confined(\n            options,\n            commit_bytes,\n            &package,\n            parent_token.as_raw_handle(),\n            &context,\n            &inherited,\n            &mut command,\n        )?,\n        #[cfg(feature = \"deviations\")]\n        Shape::LpacOnly | Shape::Plain => spawn_control(\n            options,\n            &package,\n            &context,\n            &inherited,\n            &mut command,\n            deviation.shape() == Shape::LpacOnly,\n        )?,\n    };\n\n    // The child has inherited its own copies of its three pipe ends; the\n    // parent's copies would keep the pipes open after the child exits.\n    drop((child_stdin, child_stdout, child_stderr));\n"


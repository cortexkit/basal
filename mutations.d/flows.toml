build_timeout_s = 3600
timeout_s = 600
file = "flows/board-hygiene/flow.js"
old = "eta_passed: 2 * HOUR"
new = "eta_passed: 3 * HOUR /* NON-VACUITY BREAK */"

[[control]]
id = "board-hygiene-stale-interval"
guards = "stale active nudges repeat only after six hours"
test_file = "crates/basal-module/tests/board_hygiene.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test board_hygiene"
expect_red = ["stale_active_first_at_six_hours_and_repeats_after_six_hours"]
only = false
build_timeout_s = 3600
timeout_s = 600
file = "flows/board-hygiene/flow.js"
old = "stale_active: 6 * HOUR"
new = "stale_active: 7 * HOUR /* NON-VACUITY BREAK */"

[[control]]
id = "board-hygiene-lane-done-interval"
guards = "completed lanes repeat only after two hours"
test_file = "crates/basal-module/tests/board_hygiene.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test board_hygiene"
expect_red = ["lane_done_first_at_thirty_minutes_and_repeats_after_two_hours_with_fallback"]
only = false
build_timeout_s = 3600
timeout_s = 600
file = "flows/board-hygiene/flow.js"
old = "lane_done: 2 * HOUR"
new = "lane_done: 3 * HOUR /* NON-VACUITY BREAK */"

[[control]]
id = "board-hygiene-unknown-activity"
guards = "unknown activity never proves a stale item owner was active"
test_file = "crates/basal-module/tests/board_hygiene.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test board_hygiene"
expect_red = ["unknown_activity_skips_stale_items"]
only = false
build_timeout_s = 3600
timeout_s = 600
file = "flows/board-hygiene/flow.js"
old = "activity?.status === 'ok'"
new = "activity?.status !== 'denied' /* NON-VACUITY BREAK */"

[[control]]
id = "board-hygiene-copy-once"
guards = "waiting owners receive only the first target ETA nudge"
test_file = "crates/basal-module/tests/board_hygiene.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test board_hygiene"
expect_red = ["item_wait_copies_only_the_first_target_eta_nudge_to_each_waiting_owner", "plain_peer_wait_copies_first_eta_once_with_own_item_data_and_replanning_choices"]
only = false
build_timeout_s = 3600
timeout_s = 600
file = "flows/board-hygiene/flow.js"
old = "if (rule === 'eta_passed' && count === 1) {"
new = "if (rule === 'eta_passed' && count >= 1) { // NON-VACUITY BREAK"

[[control]]
id = "board-hygiene-replacement-fallback"
guards = "an unsupported unsent replacement retries the same digest without its key"
test_file = "crates/basal-module/tests/board_hygiene.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test board_hygiene"
expect_red = ["unsupported_replacement_retries_without_key_and_logs_once_per_run"]
only = false
build_timeout_s = 3600
timeout_s = 600
file = "flows/board-hygiene/flow.js"
old = "        await sink.digest(agent, item, action);"
new = "        return false; // NON-VACUITY BREAK: omit the unsent digest retry"

[[control]]
id = "github-ci-watch-job-dedup"
guards = "a repeated failed job id produces no additional digest write"
test_file = "crates/basal-module/tests/flow_templates.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test flow_templates"
expect_red = ["github_ci_duplicate_job_id_adds_no_digest_write"]
only = false
build_timeout_s = 3600
timeout_s = 600
file = "templates/github-ci-watch/flow.js"
old = "if (jobEvent && Object.hasOwn(run.jobs, String(body.id ?? event.event_key))) {"
new = "if (false && Object.hasOwn(run.jobs, String(body.id ?? event.event_key))) { // NON-VACUITY BREAK"

[[control]]
id = "github-ci-watch-branch-action"
guards = "failures outside the main branch piggyback rather than waking the owner"
test_file = "crates/basal-module/tests/flow_templates.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test flow_templates"
expect_red = ["github_ci_non_main_branch_piggybacks"]
only = false
build_timeout_s = 3600
timeout_s = 600
file = "templates/github-ci-watch/flow.js"
old = "body.head_branch === params.main_branch ? 'wake' : 'piggyback'"
new = "true ? 'wake' : 'piggyback' /* NON-VACUITY BREAK */"

[[control]]
id = "github-ci-watch-unknown-not-green"
guards = "a null run conclusion stays unknown and is never reported as green"
test_file = "crates/basal-module/tests/flow_templates.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test flow_templates"
expect_red = ["github_ci_null_conclusion_and_branch_are_unknown_never_green"]
only = false
build_timeout_s = 3600
timeout_s = 600
file = "templates/github-ci-watch/flow.js"
old = "const green = !jobEvent && body.conclusion === 'success';"
new = "const green = !jobEvent && (body.conclusion ?? 'success') === 'success'; // NON-VACUITY BREAK"

[[control]]
id = "ci-failure-router-owner-routing"
guards = "different repos route to their distinct stable owner ids"
test_file = "crates/basal-module/tests/ci_failure_router.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test ci_failure_router"
select = { tests = ["two_repos_route_to_distinct_stable_owners", "rerun_attempt_gets_a_new_item_with_the_same_job_id"] }
expect_red = ["two_repos_route_to_distinct_stable_owners"]
only = true
build_timeout_s = 3600
timeout_s = 600
file = "flows/ci-failure-router/flow.js"
old = "const owner = OWNERS[repo];"
new = "const owner = OWNERS['cortexkit/basal']; // NON-VACUITY BREAK"

[[control]]
id = "ci-failure-router-unmapped-no-write"
guards = "unmapped repos write nothing instead of using a fallback owner"
test_file = "crates/basal-module/tests/ci_failure_router.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test ci_failure_router"
select = { tests = ["unmapped_repos_write_nothing_without_a_fallback", "two_repos_route_to_distinct_stable_owners"] }
expect_red = ["unmapped_repos_write_nothing_without_a_fallback"]
only = true
build_timeout_s = 3600
timeout_s = 600
file = "flows/ci-failure-router/flow.js"
old = "const owner = OWNERS[repo];"
new = "const owner = OWNERS[repo] ?? OWNERS['cortexkit/basal']; // NON-VACUITY BREAK"

[[control]]
id = "ci-failure-router-unknown-not-green"
guards = "an unknown run conclusion must never turn a red attempt green"
test_file = "crates/basal-module/tests/ci_failure_router.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test ci_failure_router"
select = { tests = ["unknown_conclusion_and_branch_are_never_green", "completed_red_updates_the_existing_item_then_green_updates_silently"] }
expect_red = ["unknown_conclusion_and_branch_are_never_green"]
only = true
build_timeout_s = 3600
timeout_s = 600
file = "flows/ci-failure-router/flow.js"
old = "const green = !jobEvent && body.conclusion === 'success';"
new = "const green = !jobEvent && (body.conclusion ?? 'success') === 'success'; // NON-VACUITY BREAK"

[[control]]
id = "ci-failure-router-ignore-workflows"

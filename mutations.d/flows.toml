# Operator-installed board flows, exercised offline through basal-module.

[[control]]
id = "board-hygiene-read-lane-blocks"
guards = "board hygiene processes laneBlocks rather than projected lane names"
test_file = "crates/basal-module/tests/board_hygiene.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test board_hygiene"
select = { tests = ["real_board_lane_blocks_shape_runs_without_throwing", "install_card_dry_run_text_matches_its_committed_fixture"] }
expect_red = ["real_board_lane_blocks_shape_runs_without_throwing"]
only = true
build_timeout_s = 3600
timeout_s = 600
file = "flows/board-hygiene/flow.js"
old = "const blocks = Array.isArray(board.laneBlocks) ? board.laneBlocks : [];"
new = "const blocks = Array.isArray(board.lanes) ? board.lanes : []; // NON-VACUITY BREAK"

[[control]]
id = "board-hygiene-wake-only-on-join"
guards = "unchanged membership and edited item fields update without a wake"
test_file = "crates/basal-module/tests/board_hygiene.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test board_hygiene"
select = { tests = ["unchanged_members_and_edited_fields_never_wake", "install_card_dry_run_text_matches_its_committed_fixture"] }
expect_red = ["unchanged_members_and_edited_fields_never_wake"]
only = true
build_timeout_s = 3600
timeout_s = 600
file = "flows/board-hygiene/flow.js"
old = "const joined = members.some(member => !previousMembers.has(member));"
new = "const joined = members.length > 0; // NON-VACUITY BREAK"

[[control]]
id = "board-hygiene-silent-on-leave"
guards = "removing members or emptying a list never wakes its owner"
test_file = "crates/basal-module/tests/board_hygiene.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test board_hygiene"
select = { tests = ["leaving_members_and_empty_lists_update_silently", "install_card_dry_run_text_matches_its_committed_fixture"] }
expect_red = ["leaving_members_and_empty_lists_update_silently"]
only = true
build_timeout_s = 3600
timeout_s = 600
file = "flows/board-hygiene/flow.js"
old = "const joined = members.some(member => !previousMembers.has(member));"
new = "const joined = members.some(member => !previousMembers.has(member)) || members.length < previousMembers.size; // NON-VACUITY BREAK"


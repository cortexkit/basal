# basal-testkit: shared test harnesses and fixtures.

# A test-fixture control: the pool test harness must stop waiting at its own
# deadline and reap the workers it started, so a stalled pool test fails by
# name instead of hanging the suite.

[[control]]
id = "pool-fixture-wait-has-no-deadline"
guards = "a stalled pool fixture fails within its own deadline and reaps its workers"
test_file = "crates/basal-module/tests/pool.rs"
runner = "cargo"
package = "basal-module"
platforms = ["macos"]
target = "--test pool"
expect_red = ["a_wait_deadline_stops_and_reaps_its_workers"]
only = false
build_timeout_s = 3600
# The broad runner covers the whole package; the guard keeps its own short deadline.
timeout_s = 600
file = "crates/basal-testkit/src/harness.rs"
old = "if Instant::now() >= deadline {"
new = "if false && Instant::now() >= deadline { // NON-VACUITY BREAK"

[[control]]
id = "dispatch-driver-wait-loses-its-short-deadline"
guards = "a deliberately stalled activation driver reaches its short wait deadline and returns its worker for reaping"
file = "crates/basal-testkit/tests/dispatch_slots.rs"
old = "const STALLED_DRIVER_WAIT: Duration = Duration::from_secs(3);"
new = "const STALLED_DRIVER_WAIT: Duration = Duration::from_secs(60); // NON-VACUITY BREAK"
edits = []
test_file = "crates/basal-testkit/tests/dispatch_slots.rs"
runner = "cargo"
package = "basal-testkit"
platforms = ["macos"]
target = "--test dispatch_slots"
expect_red = ["a_stuck_driver_wait_deadline_releases_and_reaps_its_worker"]
only = true
# The broad runner covers the whole package; the guard keeps its own short deadline.
timeout_s = 600
build_timeout_s = 3600


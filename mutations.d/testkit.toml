# Content digests, symlink-aware temp-root selection, safe publication, and
# reuse are owned and tested by cortexkit-test-support 0.1.8.
# Keep one local control so bypassing the shared staging API in basal fails.
[[control]]
id = "test-worker-is-staged-through-cortexkit-test-support"
guards = "Basal's worker entry point returns the shared content-addressed ckdev copy rather than the Cargo artifact"
file = "crates/basal-testkit/src/binaries.rs"
old = "cortexkit_test_support::ckdev_binary(binary)"
new = "binary.as_ref().to_path_buf() // NON-VACUITY BREAK"
edits = []
test_file = "crates/basal-testkit/tests/worker_discovery.rs"
runner = "cargo"
package = "basal-testkit"
platforms = ["linux"]
target = "--test worker_discovery"
expect_red = ["worker_binary_is_staged_as_a_reusable_ckdev_copy"]
only = true
timeout_s = 600
build_timeout_s = 3600

[[control]]
id = "windows-subprocess-deadline-starts-after-descendant-readiness"
guards = "The subprocess deadline starts only after its descendant is provably live"
file = "crates/basal-testkit/tests/windows_process.rs"
old = """
let error = output_until_ready(
        &mut command,
        Duration::from_secs(10),
        Duration::from_secs(120),
        || {
            descendant_ready = descendant_is_live(&dir)?;
            Ok(descendant_ready)
        },
    )
    .unwrap_err();"""
new = "let error = basal_testkit::process::output_until(&mut command, Duration::from_secs(10)).unwrap_err(); // NON-VACUITY BREAK"
test_file = "crates/basal-testkit/tests/windows_process.rs"
runner = "cargo"
package = "basal-testkit"
platforms = ["windows"]
target = "--test windows_process"
expect_red = ["subprocess_deadline_reaps_descendants_holding_output_pipes"]
only = true
timeout_s = 600
build_timeout_s = 3600

[[control]]
id = "race-cut-requires-long-call-acceptance"
guards = "the replay-barrier cut waits for position 0 to be accepted even when position 1 answers first"
file = "crates/basal-testkit/tests/journal_races.rs"
old = "if matches!(b, Boundary::HostAnswered { position: 1 }) {"
new = "if false && matches!(b, Boundary::HostAnswered { position: 1 }) { // NON-VACUITY BREAK"
edits = []
test_file = "crates/basal-testkit/tests/journal_races.rs"
runner = "cargo"
package = "basal-testkit"
platforms = ["linux"]
target = "--test journal_races"
expect_red = ["race_cut_late_outcome_waits_for_the_barrier"]
only = true
timeout_s = 600
build_timeout_s = 3600

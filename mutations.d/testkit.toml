if destination.is_file() {
        return Ok(());
    }"""
new = """
if destination.is_file() {
        fs::remove_file(destination)?; // NON-VACUITY BREAK
    }"""
edits = []
test_file = "crates/basal-testkit/src/binaries.rs"
runner = "cargo"
package = "basal-testkit"
target = "--lib"
expect_red = ["binaries::tests::pre_existing_complete_copy_is_reused_without_rewriting"]
only = true
platforms = ["linux"]
timeout_s = 600
build_timeout_s = 3600

[[control]]
id = "content-addressed-directory-uses-path-not-bytes"
guards = "Changed executable bytes select a different content-addressed directory"
file = "crates/basal-testkit/src/binaries.rs"
old = "let digest_name = digest.to_hex().to_string()[..16].to_owned();"
new = """
let digest_name = blake3::hash(sources[0].2.as_os_str().as_encoded_bytes())
            .to_hex()
            .to_string()[..16]
            .to_owned(); // NON-VACUITY BREAK"""
edits = []
test_file = "crates/basal-testkit/src/binaries.rs"
runner = "cargo"
package = "basal-testkit"
target = "--lib"
expect_red = ["binaries::tests::changed_binary_bytes_use_a_different_directory"]
only = true
platforms = ["linux"]
timeout_s = 600
build_timeout_s = 3600

[[control]]
id = "ckdev-named-binary-runs-from-its-build-folder"
guards = "Every executable is copied out of its build folder, even one already named ckdev-, so nothing runs from a removable target volume"
file = "crates/basal-testkit/src/binaries.rs"
old = """
    let binary = binary.as_ref();
    static COPIES"""
new = """
    let binary = binary.as_ref();
    if !binary.file_name().and_then(|name| name.to_str()).is_some_and(|name| name.starts_with("ck-")) {
        return binary.to_path_buf(); // NON-VACUITY BREAK
    }
    static COPIES"""
edits = []
test_file = "crates/basal-testkit/src/binaries.rs"
runner = "cargo"
package = "basal-testkit"
target = "--lib"
expect_red = ["binaries::tests::copies_never_run_from_their_build_folder_whatever_the_name"]
only = true
platforms = ["linux"]
timeout_s = 600
build_timeout_s = 3600

[[control]]
id = "macos-copies-use-the-var-folders-temp-dir"
guards = "On macOS executable copies live in a private, user-owned folder under /tmp, where a fresh copy starts at once"
file = "crates/basal-testkit/src/binaries.rs"
old = """let root = PathBuf::from(format!("/tmp/basal-exec-{uid}"));"""
new = """let root = std::env::temp_dir().join(format!("basal-exec-{uid}")); // NON-VACUITY BREAK"""
edits = []
test_file = "crates/basal-testkit/src/binaries.rs"
runner = "cargo"
package = "basal-testkit"
target = "--lib"
expect_red = ["binaries::tests::macos_copies_live_in_a_private_folder_under_tmp"]
only = true
platforms = ["macos"]
timeout_s = 600
build_timeout_s = 3600

[[control]]
id = "windows-subprocess-deadline-starts-after-descendant-readiness"
guards = "The subprocess deadline starts only after its descendant is provably live"
file = "crates/basal-testkit/tests/windows_process.rs"
old = """
let error = output_until_ready(
        &mut command,
        Duration::from_secs(10),
        Duration::from_secs(120),
        || {
            descendant_ready = descendant_is_live(&dir)?;
            Ok(descendant_ready)
        },
    )
    .unwrap_err();"""
new = "let error = basal_testkit::process::output_until(&mut command, Duration::from_secs(10)).unwrap_err(); // NON-VACUITY BREAK"
test_file = "crates/basal-testkit/tests/windows_process.rs"
runner = "cargo"
package = "basal-testkit"
platforms = ["windows"]
target = "--test windows_process"
expect_red = ["subprocess_deadline_reaps_descendants_holding_output_pipes"]
only = true
timeout_s = 600
build_timeout_s = 3600

[[control]]
id = "flow-tool-caller-taken-from-arguments"
guards = "the flow caller is the agent stamped by the daemon, never a model argument"
test_file = "crates/basal-module/tests/tool_provider_conformance/flow.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test tool_provider_conformance"
select = { tests = ["flow::flow_caller_guard_uses_stamp_not_arguments", "flow::flow_catalog_has_exact_capability_tag"] }
expect_red = ["flow::flow_caller_guard_uses_stamp_not_arguments"]
only = true
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-module/src/flow_tool.rs"
old = 'let caller = crate::caller::from_route(Some(&context.principal), context.scope.as_ref());'
new = '''let caller = Caller::Agent { // NON-VACUITY BREAK
    agent_id: request.arguments["agent_id"].as_str().unwrap_or("argument-agent").to_owned(),
    scope_ref: context.scope.as_ref().map(|s| s.scope_ref.clone()).unwrap_or_default(),
};'''

[[control]]
id = "flow-file-read-uses-aft-management-surface"
guards = "flow file reads open AFT's tool-provider route, which AFT admits under a flow-read scope; its management surface is refused there"
test_file = "crates/basal-host/src/transport.rs"
runner = "cargo"
package = "basal-host"
platforms = ["linux"]
target = "--lib"
expect_red = ["transport::tests::flow_file_reads_open_aft_on_the_exact_invoking_scope"]
only = false
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-host/src/transport.rs"
old = "                .open_route_scoped(\n                    RouteTarget::ToolProvider {\n                        module_id: \"aft\".into(),"
new = "                .open_route_scoped(\n                    RouteTarget::ManagementSurface { // NON-VACUITY BREAK\n                        module_id: \"aft\".into(),"

[[control]]
id = "flow-file-read-malformed-reply-excerpt-is-bounded"
guards = "malformed AFT file replies expose no more than 200 bytes in their escaped excerpt"
test_file = "crates/basal-module/tests/tool_provider_conformance/flow.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test tool_provider_conformance"
select = { tests = ["flow::install_malformed_reply_includes_a_bounded_excerpt", "flow::install_digest_guard_rechecks_returned_bytes"] }
expect_red = ["flow::install_malformed_reply_includes_a_bounded_excerpt"]
only = true
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-module/src/flow_tool.rs"
old = "const FILE_READ_EXCERPT_BYTES: usize = 200;"
new = "const FILE_READ_EXCERPT_BYTES: usize = 201; // NON-VACUITY BREAK"

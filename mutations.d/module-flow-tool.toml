# Agent flow-tool authority and exact file-read guards.

[[control]]
id = "flow-tool-read-scope-check-bypassed"
guards = "flow installs require core's ephemeral flow-read scope before attempting a read"
test_file = "crates/basal-module/tests/tool_provider_conformance/flow.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test tool_provider_conformance"
select = { tests = ["flow::install_scope_guard_refuses_without_reading", "flow::flow_catalog_has_exact_capability_tag"] }
expect_red = ["flow::install_scope_guard_refuses_without_reading"]
only = true
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-module/src/flow_tool.rs"
scope = { after = "fn read_scope(", before = "\nimpl Module" }
old = 'matches!(&scope.owner, Principal::Reserved { module_id } if module_id == "prefrontal-core")'
new = 'true || matches!(&scope.owner, Principal::Reserved { module_id } if module_id == "prefrontal-core") // NON-VACUITY BREAK'


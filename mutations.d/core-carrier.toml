[[control]]
id = "core-carrier-board-read-stamp-not-injected"
guards = "board.read receives the approved install stamp on basal's own route and journals it as a query"
test_file = "crates/basal-testkit/tests/flow_scopes.rs"
runner = "cargo"
package = "basal-testkit"
platforms = ["linux"]
target = "--test flow_scopes"
select = { tests = ["board_read_uses_basal_route_with_journaled_approved_stamp", "board_read_refuses_script_supplied_stamp_fields"] }
expect_red = ["board_read_uses_basal_route_with_journaled_approved_stamp"]
only = true
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-core/src/driver.rs"
scope = { after = "fn prepare(&self, call: &HostCall)", before = "\n    fn " }
old = '"stamp".into(),'
new = '"missing_stamp".into(), // NON-VACUITY BREAK'

[[control]]
id = "core-carrier-board-read-script-stamp-allowed"
guards = "scripts cannot supply or override approved install stamp fields"
test_file = "crates/basal-testkit/tests/flow_scopes.rs"
runner = "cargo"
package = "basal-testkit"
platforms = ["linux"]
target = "--test flow_scopes"
select = { tests = ["board_read_refuses_script_supplied_stamp_fields", "board_read_uses_basal_route_with_journaled_approved_stamp"] }
expect_red = ["board_read_refuses_script_supplied_stamp_fields"]
only = true
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-core/src/driver.rs"
scope = { after = "fn prepare(&self, call: &HostCall)", before = "\n    fn " }
old = '.any(|field| object.contains_key(*field))'
new = '.any(|field| false && object.contains_key(*field)) // NON-VACUITY BREAK'

[[control]]
id = "revoked-version-dispatch-fence-is-bypassed"
guards = "Every host-call family stops on a revoked pinned instance version, without changing enablement"
test_file = "crates/basal-module/tests/install_revoked.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test install_revoked"
expect_red = ["template_and_package_instances_stop_every_call_family_without_changing_enablement"]
select = { tests = ["template_and_package_instances_stop_every_call_family_without_changing_enablement", "an_unrevoked_run_dispatches_local_and_remote_calls"] }
only = true
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-core/src/revocation.rs"
old = "match version {"
new = "match version.filter(|_| false) { // NON-VACUITY BREAK"

[[control]]
id = "revocation-hint-is-trusted-without-status-read"
guards = "An active status reply defeats a revocation hint; the hint cannot replace the status read"
test_file = "crates/basal-module/tests/install_gate.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test install_gate"
expect_red = ["revocation_hint_checks_status_and_ignores_active"]
select = { tests = ["revocation_hint_checks_status_and_ignores_active", "revocation_hint_never_approved_is_a_noop"] }
only = true
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-core/src/revocation.rs"
old = '''let status = self
            .shared
            .host
            .install_status(flow, version)
            .map_err(|e| {
                CoreError::Unavailable(format!("no install status for {flow} v{version}: {e}"))
            })?;'''
new = '''let status = InstallStatus::Revoked { code_hash: hash.clone() }; // NON-VACUITY BREAK'''

[[control]]
id = "revoked-run-counts-as-a-health-failure"
guards = "Health exposes version_revoked but excludes it from failure and auto-disable counts"
test_file = "crates/basal-module/tests/install_revoked.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test install_revoked"
expect_red = ["push_mid_script_stops_the_next_call_and_health_does_not_count_a_failure"]
select = { tests = ["push_mid_script_stops_the_next_call_and_health_does_not_count_a_failure", "an_unrevoked_run_dispatches_local_and_remote_calls"] }
only = true
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-core/src/ops.rs"
old = '''Some("readiness_rejection" | "agent_retired" | "version_revoked")'''
new = '''Some("readiness_rejection" | "agent_retired") /* NON-VACUITY BREAK */'''

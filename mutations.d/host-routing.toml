[[control]]
id = "unknown-reasons-a-timed-out-reply-is-recorded-as-a-lost-connection"
guards = "unknown reasons: a timed-out reply is recorded as a lost connection"
test_file = "crates/basal-module/tests/decisions.rs"
runner = "cargo"
package = "basal-module"
platforms = ["macos"]
target = "--test decisions"
expect_red = ["each_unknown_site_records_its_reason_and_the_card_shows_it"]
only = false
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-host/src/transport.rs"
old = "Self::TimedOut(_) => Some(UnknownReason::ReplyTimeout),"
new = "Self::TimedOut(_) => Some(UnknownReason::ConnectionLost),"


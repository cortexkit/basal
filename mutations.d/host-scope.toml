[[control]]
id = "run-scope-legacy-capability-skipped"
guards = "a readable legacy provider catalog admits tools without per-tool mode opt-in"
test_file = "crates/basal-host/src/run_scope.rs"
runner = "cargo"
package = "basal-host"
platforms = ["linux"]
target = "--lib"
select = { tests = ["run_scope::call_mode_tests::a_readable_legacy_catalog_does_not_require_per_tool_mode_opt_in", "run_scope::call_mode_tests::a_call_modes_provider_whose_tool_lists_codemode_is_admitted"] }

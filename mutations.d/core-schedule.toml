guards = "the schedule is not advanced and fire ids are not derived from the due time"
test_file = "crates/basal-testkit/tests/schedule_tick.rs"
runner = "cargo"
package = "basal-testkit"
platforms = ["macos"]
target = "--test schedule_tick"
expect_red = ["a_repeated_tick_with_the_same_now_admits_nothing_new"]
only = false
build_timeout_s = 3600
timeout_s = 600
edits = [
  { file = "crates/basal-core/src/schedule/tick.rs", old = "params![flow_id, scan.next.map(to_ms), last_fired, at],", new = "params![flow_id, row.next_due.map(to_ms), last_fired, at]," },
  # New fires keep their IDs; only a re-planned, already admitted fire gets a new ID.
  { file = "crates/basal-core/src/schedule/tick.rs", old = "                fire.trigger_id,", new = "                { // NON-VACUITY BREAK\n                    let duplicate: bool = tx.query_row(\"SELECT EXISTS(SELECT 1 FROM trigger_inbox WHERE flow_id = ?1 AND trigger_id = ?2)\", params![flow_id, fire.trigger_id], |r| r.get(0))?;\n                    if duplicate {\n                        let count: i64 = tx.query_row(\"SELECT COUNT(*) FROM trigger_inbox WHERE flow_id = ?1\", [flow_id], |r| r.get(0))?;\n                        format!(\"{}:{count}\", fire.trigger_id)\n                    } else { fire.trigger_id.clone() }\n                }," },
]


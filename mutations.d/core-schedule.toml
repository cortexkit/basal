id = "corrupt-oldest-fire-stops-all-admission"
guards = "a corrupt planned fire must not indefinitely block healthy planned fires"
file = "crates/basal-core/src/schedule/tick.rs"
old = """
let CoreError::Corrupt(detail) = error else {
                    return Err(error);
                };"""
new = """
let CoreError::Corrupt(detail) = error else {
                    return Err(error);
                };
                if std::hint::black_box(true) { return Err(CoreError::Corrupt(detail.clone())); } // NON-VACUITY BREAK"""
edits = []
test_file = "crates/basal-core/src/runtime_authorization_regressions.rs"
runner = "cargo"
package = "basal-core"
platforms = ["linux"]
target = "--lib"
expect_red = ["runtime_authorization_regressions::corrupt_oldest_fire_does_not_block_healthy_fires"]
only = true
timeout_s = 600
build_timeout_s = 3600

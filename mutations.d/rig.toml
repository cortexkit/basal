# basal-rig: the test rig's contract probes, model and store fixtures.

[[control]]
id = "rig-model-send-tools-check-omitted"
guards = "Model evidence must reject attached tools"
file = "crates/basal-rig/src/models.rs"
old = 'send["tools"] == json!([]) && send["tool_choice"] == json!({"type":"none"})'
new = 'send["tool_choice"] == json!({"type":"none"}) // NON-VACUITY BREAK: ignore attached tools.'
edits = []
test_file = "crates/basal-rig/src/models.rs"
runner = "cargo"
package = "basal-rig"
platforms = ["macos"]
target = "--lib"
expect_red = ["models::tests::tools_evidence_requires_empty_tools_and_explicit_none"]
only = true
timeout_s = 600
build_timeout_s = 3600


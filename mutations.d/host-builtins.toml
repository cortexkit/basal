# basal-host built-ins: fs, git and net, including their macOS and Windows paths.


[[control]]
id = "fs-a-path-is-not-required-to-lie-under-a-root-symlink-out"
hub = "Every resolved filesystem path remains under a granted root, including symlinks, missing-path ancestors, compromised envelopes and temporary-write directories moved outside their root"
hub_targets = ["builtins_dispatch", "builtins_fs", "fs_write_temps"]
guards = "fs: a path is not required to lie under a root (symlink out)"
test_file = "crates/basal-testkit/tests/builtins_fs.rs"
runner = "cargo"
package = "basal-testkit"
platforms = ["macos"]
target = "--test builtins_fs"
expect_red = ["a_symlink_resolving_outside_the_root_is_refused"]
only = false
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-host/src/builtins/fs.rs"
old = "roots.iter().any(|root| path.starts_with(root))"
new = "!roots.is_empty() // NON-VACUITY BREAK"


guards = "macOS F_GETPATH containment refuses a repository redirected before the checked open"
file = "crates/basal-host/src/builtins/fs.rs"
old = """
#[cfg(target_os = "macos")]
fn verify(fd: RawFd, name: Option<&OsStr>, roots: &[PathBuf]) -> Result<(), Denial> {
    verify_path(
        fd_path(fd).map_err(|e| Denial::new(codes::IO, e.to_string()))?,
        name,
        roots,
    )
}"""
new = """
#[cfg(target_os = "macos")]
fn verify(fd: RawFd, name: Option<&OsStr>, roots: &[PathBuf]) -> Result<(), Denial> {
    let _ = (fd, name, roots); Ok(()) // NON-VACUITY BREAK: bypass F_GETPATH containment
}"""
edits = []
test_file = "crates/basal-host/src/builtins/git/tests.rs"
runner = "cargo"
package = "basal-host"
target = "--lib"
select = "expected"
expect_red = ["builtins::git::tests::repository::ancestor_swap_before_macos_verified_open_is_refused"]
only = false
platforms = ["macos"]
timeout_s = 600
build_timeout_s = 3600

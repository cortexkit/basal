# basal-core runtime: the driver, dispatch, the install gate, admission and rate limits.

[[control]]
id = "calls-of-one-run-dispatched-serially-on-the-activation-s-thread"
hub = "Calls dispatch concurrently off the activation thread, so a blocked or panicking host cannot take over that thread and prevent other calls, deadline enforcement, ownership loss or temporary-write crash recovery from progressing"
hub_targets = ["dispatch_slots", "flow_scopes", "fs_write_temps", "journal_ownership"]
guards = "calls of one run dispatched serially on the activation's thread"
test_file = "crates/basal-testkit/tests/journal_races.rs"
runner = "cargo"
package = "basal-testkit"
platforms = ["macos"]
target = "--test journal_races"
expect_red = ["calls_of_one_run_are_dispatched_concurrently"]
only = false
build_timeout_s = 3600
# Serial dispatch also stalls gated drivers. Their bounded joins leave room for
# healthy scheduling delays, and the broad replay pays those waits under load.
timeout_s = 3600
file = "crates/basal-core/src/runtime.rs"
old = "let handle = thread::spawn(f);"
new = "f(); // NON-VACUITY BREAK\n        let handle = thread::spawn(|| {});"


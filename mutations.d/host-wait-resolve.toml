[[control]]
id = "wait-resolve-core-capability-before-send"
guards = "Wait resolutions cannot leave basal without core advertising flow-wait-resolve/v1, including on replay"
test_file = "crates/basal-module/tests/hosts/wait_resolve.rs"
runner = "cargo"
package = "basal-module"
target = "--test hosts"
platforms = ["linux"]
expect_red = ["wait_resolve::wait_dispatch_gate_refuses_without_core_capability"]
select = { tests = ["wait_resolve::wait_dispatch_gate_refuses_without_core_capability", "wait_resolve::wait_wire_matches_met_failed_and_all_reply_vectors"] }
only = true
file = "crates/basal-host/src/core_host.rs"
old = "if p == Primitive::SinkWaitResolve && !self.supports_capability(FLOW_WAIT_RESOLVE_V1) {"
new = "if false && p == Primitive::SinkWaitResolve && !self.supports_capability(FLOW_WAIT_RESOLVE_V1) { // NON-VACUITY BREAK"

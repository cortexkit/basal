[[control]]
id = "board-sink-target-grant-before-dispatch"
guards = "Board writes without an approved target grant are provably unsent"
test_file = "crates/basal-module/tests/hosts/board_sink.rs"
runner = "cargo"
package = "basal-module"
target = "--test hosts"
platforms = ["linux"]
expect_red = ["board_sink::board_target_refusal_is_unsent_and_final_refusals_reach_script"]
select = { tests = ["board_sink::board_target_refusal_is_unsent_and_final_refusals_reach_script", "board_sink::board_operations_pin_stamped_wire_bytes_and_receipts"] }
only = true
file = "crates/basal-core/src/authorize.rs"
scope = { after = "Primitive::SinkBoard => {", before = "Primitive::SinkStatus => {" }
old = "if manifest.board.iter().any(|g| g.agent == target) {"
new = "if true || manifest.board.iter().any(|g| g.agent == target) { // NON-VACUITY BREAK"


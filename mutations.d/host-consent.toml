# Core owns install cards; these controls replay the request and hint contract.
[[control]]
id = "install-request-not-dedicated"
guards = "install cards enter through core's dedicated request, never generic elicitation or cingulate"
file = "crates/basal-host/src/core_consent.rs"
old = '.management(CORE, "flow.install_request", request(card)?)'
new = '.management(CORE, "elicitation.request", request(card)?) /* NON-VACUITY BREAK */'
test_file = "crates/basal-module/tests/install_policy.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test install_policy"
expect_red = ["install_cards_only_use_core_install_request_and_never_wake_answer_polling"]
only = false
build_timeout_s = 3600
timeout_s = 600

[[control]]
id = "install-feed-applies-retired-install-answer"
guards = "install answers can no longer drive approvals through the decision feed"
file = "crates/basal-host/src/core_consent.rs"
old = '''if record.get("flow_install").is_some() {
        return Ok(());
    }'''
new = '''if record.get("flow_install").is_some() {
        return sink.decide(&crate::DecisionEvent { card_id: "retired".into(), decision: crate::CardDecision::Approve, decided_by: "retired".into() }).map_err(sink_error); // NON-VACUITY BREAK
    }'''
test_file = "crates/basal-module/tests/hosts.rs"
runner = "cargo"
package = "basal-module"
platforms = ["linux"]
target = "--test hosts"
expect_red = ["install_answers_are_ignored_in_the_decision_feed"]
only = true
build_timeout_s = 3600
timeout_s = 600



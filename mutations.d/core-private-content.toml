[[control]]
id = "private-content-providers-allows-seventeen"
guards = "New manifests admit at most sixteen extra private-content providers"
test_file = "crates/basal-core/src/private_content_providers_tests.rs"
runner = "cargo"
package = "basal-core"
platforms = ["linux"]
target = "--lib"
expect_red = ["manifest::private_content_providers_tests::provider_lists_reject_more_than_sixteen"]
select = { filter = "manifest::private_content_providers_tests::" }
only = true
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-core/src/manifest.rs"
old = "if self.private_content_providers.len() > 16 {"
new = "if self.private_content_providers.len() > 17 { // NON-VACUITY BREAK"

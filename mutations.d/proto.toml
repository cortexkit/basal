# basal-proto: the wire codec, frame limits and shared protocol types.

[[control]]
id = "frame-size-not-checked-before-reading-the-payload"
guards = "frame size not checked before reading the payload"
test_file = "crates/basal-worker/tests/ipc.rs"
runner = "cargo"
package = "basal-worker"
platforms = ["macos"]
target = "--test ipc"
expect_red = ["oversized_frame_is_refused_and_the_worker_exits_cleanly"]
only = false
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-proto/src/frame.rs"
old = "let len = u32::from_be_bytes(header) as usize;\n    if len > MAX_FRAME_BYTES {"
new = "let len = u32::from_be_bytes(header) as usize;\n    if false && len > MAX_FRAME_BYTES {"

[[control]]
id = "protocol-list-count-ignores-element-wire-size"
guards = "protocol list count ignores element wire size"
file = "crates/basal-proto/src/codec.rs"
old = "let needed = len.saturating_mul(minimum_bytes);"
new = "let needed = len; let _ = minimum_bytes; // NON-VACUITY BREAK"
edits = []
test_file = "crates/basal-proto/src/codec.rs"
runner = "cargo"
package = "basal-proto"
platforms = ["linux"]
target = "--lib"
expect_red = ["codec::tests::list_counts_require_the_complete_minimum_wire_size"]
only = true
timeout_s = 600
build_timeout_s = 3600

[[control]]
id = "protocol-encoder-allows-empty-names"
guards = "protocol encoder allows empty names"
file = "crates/basal-proto/src/codec.rs"
old = "if value.is_empty() {"
new = "if false && value.is_empty() { // NON-VACUITY BREAK"
edits = []
test_file = "crates/basal-worker/tests/shutdown.rs"
runner = "cargo"
package = "basal-worker"
platforms = ["macos"]

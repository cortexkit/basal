build_timeout_s = 3600

# Codemode wire and worker-profile guards. These basal-proto library and
# basal-worker codemode tests exercise platform-independent behavior. Mutation
# proofs run once on Linux; workspace gates run the tests on all three supported OSes.
[[control]]
id = "codemode-protocol-version"
hub = "Both the protocol version assertion and the fixed Welcome wire fixture pin version 9"
hub_targets = ["basal_proto"]
guards = "the worker wire requires protocol version 9 to carry admission-time template params"
test_file = "crates/basal-proto/src/lib.rs"
runner = "cargo"
package = "basal-proto"
platforms = ["linux"]
target = "--lib"
expect_red = ["tests::codemode_wire_codes_preserve_shell_and_round_trip_tool_json", "tests::confinement_wire_tags_and_linux_fields_are_stable"]
only = true
file = "crates/basal-proto/src/limits.rs"
old = "pub const PROTOCOL_VERSION: u32 = 9;"
new = "pub const PROTOCOL_VERSION: u32 = 8; // NON-VACUITY BREAK"

[[control]]
id = "codemode-address-space-headroom"
guards = "codemode process ceiling exceeds the heap cap"
test_file = "crates/basal-proto/src/lib.rs"
runner = "cargo"
package = "basal-proto"
platforms = ["linux"]
target = "--lib"
expect_red = ["tests::codemode_wire_codes_preserve_shell_and_round_trip_tool_json"]
only = false
file = "crates/basal-proto/src/limits.rs"
old = "pub const CODEMODE_ADDRESS_SPACE_BYTES: u64 = 512 * 1024 * 1024;"
new = "pub const CODEMODE_ADDRESS_SPACE_BYTES: u64 = 64 * 1024 * 1024; // NON-VACUITY BREAK"

[[control]]
id = "codemode-tool-wire-code"
hub = "Shell code 11 remains decodable, asserted by the codemode wire test and the generic worker-message roundtrip"
hub_targets = ["basal_proto"]
guards = "tool code is above primitives and never reuses shell code 11"
test_file = "crates/basal-proto/src/lib.rs"
runner = "cargo"
package = "basal-proto"
platforms = ["linux"]
target = "--lib"
expect_red = ["tests::codemode_wire_codes_preserve_shell_and_round_trip_tool_json"]
only = false
file = "crates/basal-proto/src/wire.rs"
old = "const CALL_TOOL: u8 = 22;"
new = "const CALL_TOOL: u8 = 11; // NON-VACUITY BREAK"

[[control]]
id = "codemode-activation-tools-wire"
hub = "Catalog names survive activation encoding, asserted by the codemode and generic parent-message roundtrips"
hub_targets = ["basal_proto"]
guards = "activation carries the catalog tool names"
test_file = "crates/basal-proto/src/lib.rs"
runner = "cargo"
package = "basal-proto"
platforms = ["linux"]
target = "--lib"
expect_red = ["tests::codemode_activation_tools_round_trip_and_names_are_bounded"]
only = false
file = "crates/basal-proto/src/wire.rs"
old = "enc.count(req.tools.len());"
new = "enc.count(0); // NON-VACUITY BREAK"

[[control]]
id = "codemode-welcome-hash-wire"

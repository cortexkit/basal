[[control]]
id = "outcomes-arriving-during-an-activation-are-never-released-by-it"
hub = "Available mailbox outcomes are delivered in the current activation after prefix replay; live calls, refusals, recovery, temporary writes and instance operations depend on that delivery to progress instead of exhausting their activation deadlines"
hub_targets = ["builtins_dispatch", "dispatch_authorization", "dispatch_kv", "dispatch_limits", "dispatch_tokens", "flow_scope_recovery", "flow_scopes", "fs_write_temps", "global_model_scope", "journal_admin", "journal_cut", "journal_identity", "journal_kill", "journal_ownership", "journal_races", "journal_unknown", "package_instances", "template_instances"]
guards = "outcomes arriving during an activation are never released by it"
test_file = "crates/basal-testkit/tests/journal_races.rs"
runner = "cargo"
package = "basal-testkit"
platforms = ["macos"]
target = "--test journal_races"
expect_red = ["completion_during_replay_is_released_after_the_prefix"]
only = false
build_timeout_s = 3600
# The broad replay withholds replies in many tests, each retaining its healthy
# 20- or 60-second activation budget. Allow their failures to finish under load.
timeout_s = 7200
file = "crates/basal-core/src/journal.rs"
old = "WHERE run_id=?1 AND position IN (SELECT value FROM json_each(?2)) ORDER BY seq LIMIT 1"
new = "WHERE run_id=?1 AND position IN (SELECT value FROM json_each(?2)) AND arrived_generation < (SELECT generation FROM runs WHERE run_id=?1) ORDER BY seq LIMIT 1"


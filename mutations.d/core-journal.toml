# basal-core journal and store: journal, schema migrations, runs, retention and KV.


[[control]]
id = "late-outcome-shipped-in-the-prefix-with-a-higher-order-replay-barrier-removed"
hub = "An earlier unresolved call cannot join a replay prefix after a later call has already been released; race, token and crash recovery tests assert this barrier"
hub_targets = ["dispatch_tokens", "journal_cut", "journal_kill"]
guards = "late outcome shipped in the prefix with a higher order (replay barrier removed)"
test_file = "crates/basal-testkit/tests/journal_races.rs"
runner = "cargo"
package = "basal-testkit"
platforms = ["macos"]
target = "--test journal_races"
expect_red = ["race_cut_late_outcome_waits_for_the_barrier"]
only = false
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-core/src/journal.rs"
old = "let prefix: Vec<RecordedCall> = rows.iter().map(CallRow::recorded).collect();"
# Only unresolved calls before an already released call cross the replay barrier.
new = "let mut prefix: Vec<RecordedCall> = rows.iter().map(CallRow::recorded).collect();\n    let mut next = prefix.iter().filter_map(|c| c.outcome.as_ref().map(|o| o.delivery_order + 1)).max().unwrap_or(0);\n    let mut stmt = conn.prepare(\"SELECT m.position, m.settlement, m.value FROM mailbox m JOIN journal j ON j.run_id = m.run_id AND j.position = m.position WHERE m.run_id = ?1 AND j.settlement IS NULL AND m.position < (SELECT MAX(position) FROM journal WHERE run_id = ?1 AND delivery_order IS NOT NULL) ORDER BY m.seq\")?;\n    let late = stmt.query_map([run_id], |r| Ok((r.get::<_, i64>(0)?, r.get::<_, String>(1)?, r.get::<_, String>(2)?)))?.collect::<rusqlite::Result<Vec<_>>>()?;\n    for (p, s, v) in late { // NON-VACUITY BREAK\n        if let Some(call) = prefix.get_mut(to_u64(p, \"position\")? as usize) {\n            call.outcome = Some(basal_proto::RecordedOutcome { settlement: parse_settlement(&s)?, value: json(v, \"late value\")?, delivery_order: next });\n            next += 1;\n        }\n    }"


# basal-core codemode: admission, supervision, store, catalog and model tools.

# The run and call tables are guarded twice: each conditional write in
# codemode::store, and a schema trigger that aborts a writer that forgot
# the condition. A store-function mutant is therefore caught by the test
# that expects `false`, not by a silent overwrite.

[[control]]
id = "codemode-outcome-write-requires-pending"
guards = "a recorded codemode call outcome is never replaced, and a late answer after termination is dropped"
test_file = "crates/basal-core/src/codemode/store_tests.rs"
runner = "cargo"
package = "basal-core"
platforms = ["linux"]
target = "--lib"
expect_red = ["codemode::store::tests::a_recorded_outcome_never_changes", "codemode::store::tests::termination_cancels_queued_calls_and_marks_sent_calls_unknown"]
only = false
file = "crates/basal-core/src/codemode/store.rs"
old = "WHERE run_id = ?1 AND position = ?2 AND outcome = 'pending'\","
new = "WHERE run_id = ?1 AND position = ?2\","

[[control]]
id = "codemode-terminal-write-requires-running"
guards = "the first terminal write is a codemode run's end; a later one changes nothing"
test_file = "crates/basal-core/src/codemode/store_tests.rs"
runner = "cargo"
package = "basal-core"
platforms = ["linux"]
target = "--lib"
expect_red = ["codemode::store::tests::a_terminal_write_never_overwrites_another"]
only = false
file = "crates/basal-core/src/codemode/store.rs"
old = "WHERE run_id = ?1 AND status = 'running'\","
new = "WHERE run_id = ?1\","


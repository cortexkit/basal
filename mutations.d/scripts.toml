[[control]]
id = "stage-strings-inspection-fails-open"
guards = "failed strings inspection is never evidence that a production binary lacks the kill hook"
file = "script/stage.sh"
old = 'hook_table=$(strings "$TARGET/release/ck-basal") || die "cannot inspect the built ck-basal; nothing staged"'
new = 'hook_table=$(strings "$TARGET/release/ck-basal" || true) # NON-VACUITY BREAK'
edits = []
test_file = "script/tests/stage_card.py"
runner = "command"
platforms = ["linux"]
command = ["python3", "-c", 'import subprocess,sys; print("mutation diff stat:\n" + subprocess.run(["git","diff","--stat"], capture_output=True,text=True,check=True).stdout, flush=True); sys.exit(subprocess.run(["python3","-m","unittest",sys.argv[1]]).returncode)', "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ["script.tests.stage_card.StageBinaryChecks.test_binary_inspection_fails_closed"]
only = false
timeout_s = 120
build_timeout_s = 1800


# Safety proofs replayed by the pinned ckdev-mutate runner.
# Names are full libtest paths; the named guard must fail.
# Other tests in the target may also fail: the original proofs ran
# only the named test and did not assert target-wide exclusivity.
# Build and test deadlines are separate: 3600 s for loaded-host builds,
# 600 s for test binaries unless a row extends the bound for many stalled tests.
# Reports belong in target/mutations/.


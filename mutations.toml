






# Safety proofs replayed by the pinned ckdev-mutate runner.
# Names are full libtest paths; the named guard must fail.
# Other tests in the target may also fail: the original proofs ran
# only the named test and did not assert target-wide exclusivity.
# Build and test deadlines are separate: 3600 s for loaded-host builds,
# 600 s for test binaries unless a row extends the bound for many stalled tests.
# Reports belong in target/mutations/.
# Each proof has one CI host. Worker-using packages run on macOS (Seatbelt)
# or Linux (seccomp and Landlock); rows editing Linux-only confinement code
# run on Linux. Portable crates and offline command fixtures run only on Linux
# to avoid replaying them twice. Offline signing/debugger probes replace macOS
# tools with fixtures rather than invoking codesign or lldb.

# worker: 32 controls
[[control]]
id = "worker-leaves-inherited-descriptors-open"
hub = "Only stdio remains open at worker startup, asserted by both inherited-descriptor and confinement probes"
hub_targets = ["confinement"]
guards = "worker leaves inherited descriptors open"
test_file = "crates/basal-worker/tests/inherited_descriptors.rs"
runner = "cargo"
package = "basal-worker"
platforms = ["macos"]
target = "--test inherited_descriptors"
expect_red = ["worker_closes_extra_inherited_descriptors_at_startup"]
only = false
build_timeout_s = 3600
timeout_s = 600
file = "crates/basal-worker/src/confinement.rs"
old = "for fd in macos::open_descriptors().map_err(ConfinementError::Descriptors)? {"
new = "for fd in Vec::<i32>::new() { // NON-VACUITY BREAK"

